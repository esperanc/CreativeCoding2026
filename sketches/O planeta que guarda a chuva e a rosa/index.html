<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O planeta que guarda a chuva</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.min.js" defer onerror="document.getElementById('estado').textContent='Não foi possível carregar p5.js. Verifique a conexão com a internet.'"></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <main id="obra">
    <div id="universo" aria-label="Planeta em três dimensões, árvore invertida, uma rosa sob uma redoma e gotas suspensas. Arraste para girar."></div>
    <header><p class="edicao">PEQUENOS MUNDOS &nbsp; / &nbsp; 09</p><h1>O planeta <br>que guarda <br><em>a chuva.</em></h1><span class="filete"></span></header>
    <div class="comandos"><button id="chover" disabled>Deixar chover <span aria-hidden="true">↓</span></button><button id="redoma" aria-label="Abrir ou fechar a redoma da rosa">Abrir redoma</button><button id="rosa" aria-label="Aproximar a câmera da rosa">Ver a rosa ↗</button><button id="voltar" aria-label="Restaurar a vista inicial">Vista inicial</button><p id="estado" role="status">Preparando o pequeno mundo…</p></div>
    <footer><span>Henrique Kezen V. H. Leite</span><span>Arraste para girar · Role ou pince para aproximar</span></footer>
    <noscript>Ative JavaScript para visitar este pequeno mundo.</noscript>
  </main>
</body>
</html>
