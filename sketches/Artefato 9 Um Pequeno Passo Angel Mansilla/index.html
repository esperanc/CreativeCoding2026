<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Um Pequeno Passo — Angel Mansilla</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Comic+Neue:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --barra: 0px;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    /* faixas pretas de cinema; a altura vem do sketch */
    .barra {
      position: fixed;
      left: 0;
      right: 0;
      height: var(--barra);
      background: #000;
      z-index: 5;
    }

    #barra-cima { top: 0; }
    #barra-baixo { bottom: 0; }

    /* área do filme, entre as faixas */
    #filme {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--barra);
      bottom: var(--barra);
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .some {
      opacity: 0;
      transition: opacity 0.6s;
    }

    .some.visivel {
      opacity: 1;
    }

    #lugar {
      position: absolute;
      left: 3.2vw;
      bottom: 4.5vh;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(11px, 1.05vw, 16px);
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1.7;
      color: #e9e4d8;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      white-space: pre;
    }

    #radio {
      position: absolute;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      max-width: 80vw;
      font-family: Inter, system-ui, sans-serif;
      font-size: clamp(14px, 1.45vw, 23px);
      font-weight: 500;
      color: #f4f1e8;
      text-align: center;
      text-shadow: 0 0 3px #000, 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    #radio small {
      display: block;
      margin-bottom: 4px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.6em;
      letter-spacing: 0.25em;
      color: #b9c3cf;
    }

    #cartao {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(16px, 2vw, 32px);
      font-weight: 500;
      letter-spacing: 0.32em;
      color: #ece6d6;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    #narrador {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(1000px, 84vw);
      padding: 0.3em 1em;
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(17px, 2.05vw, 34px);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.06em;
      text-align: center;
      color: #f3ecd9;
      text-shadow: 0 0 4px #000, 0 2px 14px rgba(0, 0, 0, 0.95);
      /* fundo escuro esfumado: o texto passa por cima da bota branca */
      background: rgba(6, 6, 10, 0.45);
      box-shadow: 0 0 52px 26px rgba(6, 6, 10, 0.45);
      border-radius: 40px;
      transition: opacity 1.1s;
    }

    /* balão de fala; o sketch posiciona a ponta perto do capacete */
    #balao {
      position: absolute;
      left: 0;
      top: 0;
      max-width: min(470px, 40vw);
      padding: 0.75em 1.05em;
      font-family: "Comic Neue", "Comic Sans MS", sans-serif;
      font-size: clamp(15px, 1.35vw, 22px);
      font-weight: 700;
      line-height: 1.3;
      color: #15151a;
      background: #fbfaf5;
      border: 2.5px solid #15151a;
      border-radius: 1.4em;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      transition: opacity 0.25s;
    }

    #balao::after {
      content: "";
      position: absolute;
      left: 1.6em;
      bottom: -17px;
      width: 22px;
      height: 22px;
      background: #fbfaf5;
      border-right: 2.5px solid #15151a;
      border-bottom: 2.5px solid #15151a;
      transform: skewX(28deg) rotate(45deg);
      border-bottom-right-radius: 3px;
    }

    /* balão à esquerda de quem fala: a ponta sai do lado direito */
    #balao.esquerda::after {
      left: auto;
      right: 1.6em;
      transform: skewX(-28deg) rotate(45deg);
    }

    /* voz de quem está fora do quadro: a ponta aponta para cima, à esquerda */
    #balao.fora::after {
      bottom: auto;
      top: -17px;
      left: 1.4em;
      transform: skewX(28deg) rotate(-135deg);
    }

    #contador {
      position: absolute;
      right: 3vw;
      top: 4.5vh;
      min-width: 17em;
      padding: 0.9em 1.2em 1em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(11px, 0.95vw, 15px);
      color: #e8f1e9;
      background: rgba(4, 8, 10, 0.62);
      border: 1px solid rgba(160, 230, 190, 0.28);
      border-radius: 4px;
      text-shadow: 0 0 8px rgba(120, 255, 170, 0.25);
    }

    #contador .titulo {
      font-size: 0.82em;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: #8fe3b0;
    }

    #contador .sub {
      margin-top: 2px;
      font-size: 0.8em;
      color: #9fb5a8;
    }

    #contador .linha {
      display: flex;
      justify-content: space-between;
      gap: 1.4em;
      margin-top: 0.55em;
    }

    #contador .rotulo {
      color: #9fb5a8;
    }

    #contador .valor {
      font-weight: 600;
      color: #f2fbf4;
    }

    #metade {
      font-size: 1.9em;
      line-height: 1.1;
    }

    #compara {
      margin-top: 0.7em;
      padding-top: 0.6em;
      border-top: 1px solid rgba(160, 230, 190, 0.18);
    }

    #compara .rotulo {
      display: block;
      font-size: 0.85em;
    }

    #coisa {
      display: block;
      margin-top: 3px;
      font-family: Inter, system-ui, sans-serif;
      font-size: 1.25em;
      font-weight: 600;
      color: #f2fbf4;
    }

    #escala {
      margin-top: 0.7em;
      padding-top: 0.6em;
      border-top: 1px solid rgba(160, 230, 190, 0.18);
      color: #cfe3d5;
    }

    /* no fim a cena escurece antes do título */
    #cortina {
      position: absolute;
      inset: 0;
      background: #000;
      transition: opacity 1.6s;
    }

    #fim {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max-content;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: Cinzel, Georgia, serif;
      color: #f1ead6;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
      transition: opacity 1.4s;
    }

    #fim h1 {
      margin: 0;
      font-size: clamp(26px, 3.6vw, 60px);
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    #fim p {
      margin: 0.7em 0 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(11px, 0.95vw, 15px);
      letter-spacing: 0.2em;
      color: #c9c3b4;
    }

    /* vinheta e grão de filme: por cima da imagem, embaixo das faixas e dos textos */
    #vinheta, #grao {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    #vinheta {
      background: radial-gradient(ellipse 72% 68% at 50% 50%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.36) 100%);
    }

    #grao {
      opacity: 0.09;
      mix-blend-mode: overlay;
      background-size: 160px 160px;
      animation: grao 0.5s steps(1) infinite;
    }

    @keyframes grao {
      0% { background-position: 0 0; }
      20% { background-position: -53px 31px; }
      40% { background-position: 71px -17px; }
      60% { background-position: -29px -64px; }
      80% { background-position: 42px 58px; }
    }

    #carregando {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: #9a9a9a;
    }

    #carregando:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div id="vinheta"></div>
  <div id="grao"></div>
  <div id="barra-cima" class="barra"></div>
  <div id="barra-baixo" class="barra"></div>

  <div id="filme">
    <div id="lugar" class="some"></div>
    <div id="radio" class="some"></div>
    <div id="cartao" class="some"></div>
    <div id="narrador" class="some"></div>
    <div id="balao" class="some"></div>
    <div id="contador" class="some">
      <div class="titulo">PARADOXO DE ZENÃO</div>
      <div class="sub">cada passo anda metade do que falta</div>
      <div class="linha"><span class="rotulo">metade nº</span><span id="metade" class="valor">0</span></div>
      <div class="linha"><span class="rotulo">faltam</span><span id="faltam" class="valor"></span></div>
      <div class="linha"><span class="rotulo">já andou</span><span id="andou" class="valor"></span></div>
      <div id="compara"><span class="rotulo">o vão é do tamanho de</span><span id="coisa"></span></div>
      <div id="escala"></div>
    </div>
    <div id="cortina" class="some"></div>
    <div id="fim" class="some">
      <h1>UM PEQUENO PASSO</h1>
      <p>ESPAÇO: ASSISTIR DE NOVO</p>
    </div>
  </div>

  <div id="carregando">PREPARANDO A LUA…</div>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
