.\u003c/p>\n\u003c/ol>\n\u003col>\n\u003cli>\u003cstrong>Os 4 pontos.\u003c/strong> Cada vértice é sorteado em um \u003cstrong>canto\u003c/strong> desse quadrado: o\u003c/li>\n\u003cp>   vértice superior esquerdo só pode cair numa caixinha junto ao canto superior\u003cbr>   esquerdo, e assim por diante. Duas consequências: os pontos ficam sempre em\u003cbr>   ordem ao redor do centro (o quadrilátero nunca se cruza em forma de\u003cbr>   gravata-borboleta) e cada forma sai como um quadrado amassado, e não como um\u003cbr>   triângulo espetado. O parâmetro \u003ccode>CANTO\u003c/code> controla o tamanho dessas caixinhas —\u003cbr>   ou seja, quanta liberdade o acaso tem.\u003c/p>\n\u003c/ol>\n\u003col>\n\u003cli>\u003cstrong>O encolhimento.\u003c/strong> Depois de desenhar, faz-se \u003ccode>n = n × FATOR\u003c/code>. Com\u003c/li>\n\u003cp>   \u003ccode>FATOR = 0.89\u003c/code>, cada camada perde 11% do lado. É uma progressão geométrica:\u003cbr>   ao fim de 20 camadas o quadrado tem cerca de 10% do tamanho inicial.\u003c/p>\n\u003c/ol>\n\u003col>\n\u003cli>\u003cstrong>A cor.\u003c/strong> Cada pilha sorteia um ponto de partida na paleta e caminha por ela\u003c/li>\n\u003cp>   uma cor por camada, o que produz a sensação de rotação cromática para dentro.\u003cbr>   O contorno preto grosso separa as camadas e faz a sobreposição ficar legível.\u003c/p>\n\u003c/ol>\n\u003col>\n\u003cli>\u003cstrong>Determinismo.\u003c/strong> \u003ccode>randomSeed(SEMENTE)\u003c/code> garante que o sorteio seja sempre o\u003c/li>\n\u003cp>   mesmo — o desenho é aleatório, mas reprodutível.\u003c/p>\n\u003c/ol>\n\u003ch2>Como executar\u003c/h2>\n\u003cp>\u003cstrong>Opção 1 — editor online:\u003c/strong> abra &lt;https://editor.p5js.org&gt;, cole o conteúdo de\u003cbr>\u003ccode>sketch.js\u003c/code> e clique em \u003cem>Play\u003c/em>.\u003c/p>\n\u003cp>\u003cstrong>Opção 2 — local:\u003c/strong> abra o arquivo \u003ccode>index.html\u003c/code> no navegador (ele já carrega o\u003cbr>p5.js por CDN).\u003c/p>\n\u003cp>Com o sketch rodando, aperte a tecla \u003cstrong>S\u003c/strong> para salvar um PNG da imagem.\u003c/p>\n\u003ch2>Experimente mudar\u003c/h2>\n\u003cp>Todos os parâmetros estão no topo do \u003ccode>sketch.js\u003c/code>, comentados um a um:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>SEMENTE\u003c/code> — troque o número e todos os pontos mudam, no mesmo estilo.\u003c/li>\n\u003cli>\u003ccode>FATOR\u003c/code> — perto de 1 o quadrado encolhe devagar e as camadas se sobrepõem\u003c/li>\n\u003cp>  muito; perto de 0.7 o desenho mergulha rápido para o centro.\u003c/p>\n\u003cli>\u003ccode>CANTO\u003c/code> — 0.2 dá quadriláteros quase quadrados e comportados; 1.0 dá formas\u003c/li>\n\u003cp>  retorcidas e pontudas.\u003c/p>\n\u003cli>\u003ccode>CAMADAS\u003c/code> — a profundidade do túnel.\u003c/li>\n\u003cli>\u003ccode>GRADE\u003c/code> — 1 devolve uma única pilha gigante ocupando toda a tela; 5 ou 6\u003c/li>\n\u003cp>  transformam o desenho em um mosaico de pilhas pequenas.\u003c/p>\n\u003c/ul>\n\u003ch2>Arquivos\u003c/h2>\n\u003cpre>\u003ccode>sketch.js       o sketch em p5.js, comentado para iniciantes\nindex.html      página para rodar o sketch localmente\nthumbnail.png   imagem representativa do resultado\nREADME.md       este arquivo\u003c/code>\u003c/pre>","excerpt":"Artefato 2 — Quadriláteros Aninhados Autor: Murilo Jorge de Figueiredo Descrição Sketch estático em p5.js que usa exclusivamente a primitiva quad() como…"},{"folder":"Artefato 1 Manoel V C Carvalho","title":"Saffron City Night","tags":["AI","Chat GPT","Pokemon"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Sketch feito pelo Chat GPT usando apenas quads.\u003c/p>\n\u003cp>Autor: Manoel V C Carvalho\u003c/p>\n\u003cp>Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. O sketch dever conter tonalidades de rosa, roxo, fúcsia e lilás, criando um skyline (Panorama Urbano) usando como base a cidade de Saffron da franquia de jogos Pokémon, usar prioritariamente o modelo da cidade presente no jogo Let´s Go Pikachu. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores.\u003c/p>","excerpt":"Sketch feito pelo Chat GPT usando apenas quads. Autor: Manoel V C Carvalho Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado…"},{"folder":"Artefato 1 Flip LuizPacheco","title":"Flip","tags":["Quads","ClaudeAI","Movimento","CoCriatividade"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Autor: Luiz Pacheco \u003c/p>\n\u003cp>O Sketch utiliza diversos quadriláteros estáticos para representar movimento. Foi criado com o auxílio da IA Claude com ajustes manuais feitos pelo autor.\u003c/p>\n\u003cp>Prompt utilizado:\u003c/p>\n\u003cp>Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. \u003cbr>A arte final do sketch deverá ser em um formato de um quadro em retrato. O quadro será uma ilusão de ótica. O quadrilátero mais exterior deverá ter uma margem do Canva,  este quadrilátero será dividido exatamente ao meio com um retangulo fino cujo comprimento irá de ponta a ponta do quadrilátero exterior. Os retângulos restantes, de cima e de baixo, deverão ter quadriláteros internos nos quais a base superior irá diminuir cada vez mais. Crie uma fórmula para que a diminuição da base superior seja constante até chegar perto do retângulo que divide o quadrilátero maior ao meio, a base inferior dos trapézios internos deverão manter a largura da figura exterior, de forma que sua base inferior será constante e igual. O mesmo desenho deverá ser repetido na parte inferior, abaixo do retâgulo que divide a figura maior. A ideia é que pareça um calendário flip (sem nenhum número) e que suas folhas estejam constantemente virando. Para o observador as folhas poderão estar virando tanto de um lado quanto do outro, por isto importante manter a simetria. Os quadriláteros desenhados deverão apenas ter sua cor no traço, sem nenhum preenchimento interno, deixando o canva visível.\u003c/p>","excerpt":"Autor: Luiz Pacheco O Sketch utiliza diversos quadriláteros estáticos para representar movimento. Foi criado com o auxílio da IA Claude com ajustes manuais…"},{"folder":"artefato #01 Leo Nunes","title":"Composição com quads","tags":["quads","ai","chatgpt","generative"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo ChatGPT usando apenas quads. E modificado por um aluno.\u003c/p>\n\u003cp>Autor: Claudio Esperança\u003cbr>CoAutor: Leonardo Nunes Guimarães Costa\u003c/p>\n\u003cp>Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. Use aleatoriedade mas de forma que a seguir regras de composição usadas em desenho artístico.\u003c/p>\n\u003cp>Modificações Feitas: apaguei os comentários e construí uma versão mais \"clean\" do trabalho.\u003c/p>","excerpt":"Um sketch feito pelo ChatGPT usando apenas quads. E modificado por um aluno. Autor: Claudio Esperança CoAutor: Leonardo Nunes Guimarães Costa Prompt usado:…"},{"folder":"artefato 1","title":"artefato 1","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch1>Desenho com Quadriláteros\u003c/h1>\n\u003cp>\u003cstrong>Nome:\u003c/strong> Laura Daflon dos Santos Santana Meira\u003cbr>\u003cstrong>DRE:\u003c/strong> 120053993\u003c/p>\n\u003ch2>Descrição\u003c/h2>\n\u003cp>Este sketch foi desenvolvido em p5.js como parte da atividade \u003cstrong>\"Desenho com Quadriláteros\"\u003c/strong>. A composição utiliza apenas o \u003ccode>quad()\u003c/code> para desenhar as formas visuais e a ideia foi criar um padrão geométrico formado por quadriláteros coloridos organizados em faixas diagonais. As core foram escolhidas a partir de preferência pessoal.\u003c/p>\n\u003ch2>Construção do desenho\u003c/h2>\n\u003cp>O desenho é construído a partir de um nested loop, onde o loop interno faz a repetição dos quadrados em uma linha diagonal, enquanto o loop externo desloca essa linha em outra linha diagonal. O objetivo era preencher todo espaço disponível.\u003c/p>\n\u003ch2>Recursos utilizados\u003c/h2>\n\u003cul>\n\u003cli>p5.js\u003c/li>\n\u003cli>\u003ccode>quad()\u003c/code>\u003c/li>\n\u003cli>\u003ccode>fill()\u003c/code> \u003c/li>\n\u003cli>\u003ccode>noStroke()\u003c/code> para tirar a borda\u003c/li>\n\u003c/ul>","excerpt":"Desenho com Quadriláteros Nome: Laura Daflon dos Santos Santana Meira DRE: 120053993 Descrição Este sketch foi desenvolvido em p5.js como parte da atividade…"},{"folder":"quadflu","title":"quadflu","tags":["quads","flu","chatgpt","ai","generative"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo ChatGPT usando apenas quads\u003c/p>\n\u003cp>Autor: João Pedro Moretti Fontes Ferreira\u003c/p>\n\u003cp>prompt usado: \"Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em JavaScript a ser colado no editor.p5js.org.\u003c/p>\n\u003cp>O tema da arte deve ser inspirado no Fluminense Football Club, especialmente em suas cores tradicionais: verde, branco e grená. Não quero simplesmente reproduzir o escudo do clube; quero criar uma composição artística e abstrata que remeta ao Fluminense.\u003c/p>\n\u003cp>Regras obrigatórias:\u003c/p>\n\u003cp>A única primitiva geométrica de desenho permitida é quad().\u003cbr>Não use rect(), ellipse(), triangle(), line(), arc(), beginShape() ou outras primitivas de desenho.\u003cbr>É permitido usar comandos de estilização como fill(), stroke(), strokeWeight() etc.\u003cbr>O sketch deve ser completamente estático, sem animação.\u003cbr>Todo o desenho deve ser construído exclusivamente pela combinação de quadriláteros.\u003cbr>O código deve funcionar diretamente no editor.p5js.org.\u003cbr>Organize o código de forma simples e clara e documente-o com comentários para que possa ser explicado a uma plateia de iniciantes em programação.\u003c/p>\n\u003cp>Ideia visual:\u003cbr>Crie uma composição elegante formada por vários quadriláteros que lembrem faixas diagonais de uma camisa ou bandeira tricolor. Use predominantemente verde, branco e grená, alternando essas cores de maneira organizada. Os quadriláteros podem variar levemente de tamanho, posição e inclinação para criar uma composição dinâmica, mas devem manter uma aparência harmoniosa.\u003c/p>\n\u003cp>Quero que a arte tenha uma identidade visual que lembre o Fluminense sem precisar desenhar literalmente seu escudo, jogadores ou outros símbolos. Dê preferência a uma composição geométrica moderna e artística, com profundidade visual criada apenas pela sobreposição, disposição e cores dos quadriláteros.\u003c/p>\n\u003cp>Inclua também um fundo coerente com a composição.\u003c/p>\n\u003cp>No final, forneça apenas o código JavaScript completo, pronto para ser copiado para o editor.p5js.org.\"\u003c/p>","excerpt":"Um sketch feito pelo ChatGPT usando apenas quads Autor: João Pedro Moretti Fontes Ferreira prompt usado: \"Crie um sketch estático (sem animação) em p5.js.…"},{"folder":"p5 brush demo","title":"p5 brush demo","tags":["p5.brush"],"collection":"techniques/libraries","hasThumb":true,"descHtml":"\u003cp>The \"getting started\" demo for p5.brush.\u003cbr> See https://github.com/acamposuribe/p5.brush\u003c/p>","excerpt":"The \"getting started\" demo for p5.brush. See https://github.com/acamposuribe/p5.brush"},{"folder":"Design by subdivision","title":"Design by subdivision","tags":["catmull-clark","subdivision","hansmeyer","generative"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>This sketch is inspired by Michael Hansmeyer's work on design by subdivision, \u003cbr>in particular his Extended Catmull-Clark subdivision scheme, as detailed in the article\u003cbr>\"Design by Subdivision\" (http://archive.bridgesmathart.org/2010/bridges2010-167.pdf)\u003cbr>presented at the Bridges 2010 conference. Only the basic features \u003cbr>of this scheme were implemented, but enough to produce some interesting results.\u003c/p>\n\u003cp>Several other mesh operators are also implemented, including the original \u003cbr>Catmull-Clark subdivision algorithm (https://en.wikipedia.org/wiki/Catmull%E2%80%93Clark_subdivision_surface), \u003cbr>the Doo-Sabin subdivision algorithm (http://graphics.cs.ucdavis.edu/education/CAGDNotes/Doo-Sabin/Doo-Sabin.html), \u003cbr>vertex cutting, face extrusion, face center extrusion and the dual operator.\u003c/p>\n\u003cp>By default, the sketch starts in demo mode, where interesting results are \u003cbr>shown in rotation. Hit 'd' to toggle. \u003c/p>\n\u003cp>The several operations on solids, starting from one of the 5 platonic polyhedra,\u003cbr>can be applied in cascade using the interface panel.\u003c/p>","excerpt":"This sketch is inspired by Michael Hansmeyer's work on design by subdivision, in particular his Extended Catmull Clark subdivision scheme, as detailed in the…"},{"folder":"Global 2D Illumination","title":"Global 2D Illumination","tags":["generative","shader","global illumination","jump flooding"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>Follows the ideas in https://samuelbigos.github.io/posts/2dgi1-2d-global-illumination-in-godot.html about computing a global illumination in 2D using ray-marching and jump flooding.\u003c/p>\n\u003ch1>Usage\u003c/h1>\n\u003cp>Hit space to change the visualization between Illumination / Voronoi Diagram / Distance field\u003c/p>","excerpt":"Follows the ideas in https://samuelbigos.github.io/posts/2dgi1 2d global illumination in godot.html about computing a global illumination in 2D using ray…"},{"folder":"Particles with wallpaper groups","title":"Particles with wallpaper groups","tags":["flow fields","symmetry","wallpaper groups"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>Creates symmetric flow field patterns using wallpaper groups\u003c/p>\n\u003ch2>Keyboard commands:\u003c/h2>\n\u003cp>f : decrease fade factor (more opaque)\u003cbr>F : increase fade factor (more transparent)\u003c/p>\n\u003cul>\n\u003cli>: zoom in\u003c/li>\n\u003cli>: zoom out\u003c/li>\n\u003cp>G,g: New wallpaper group for the same field\u003c/p>\n\u003c/ul>\n\u003cblockquote>:  increases tile size\u003c/blockquote>\n\u003cp>&lt; :  decreases tile size\u003cbr>c,C: color scheme cycle\u003cbr>any other key: randomize\u003c/p>","excerpt":"Creates symmetric flow field patterns using wallpaper groups Keyboard commands: f : decrease fade factor (more opaque) F : increase fade factor (more…"},{"folder":"Deformable sprite sheets","title":"Deformable sprite sheets","tags":["concept","animation","sprites"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>Demonstrates the concept of using a sprite sheet generated by AI. Sprites are automatically extracted using image segmentation. Animation compounds mesh deformation and texture change.\u003c/p>\n\u003cp>No interaction\u0     var CANONICAL_DEFAULT = "https://esperanc.github.io/p5front/";

    var urlInput = document.getElementById('p5front-url');
    urlInput.value = localStorage.getItem(LS_KEY) || CANONICAL_DEFAULT;
    urlInput.addEventListener('change', function () { localStorage.setItem(LS_KEY, urlInput.value.trim()); });

    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function runUrl(folder) { return encodeURIComponent(folder) + '/'; }
    function editUrl(folder) {
      var base = (urlInput.value || CANONICAL_DEFAULT).trim();
      try {
        var u = new URL(base);
        u.searchParams.set('repo', repoRoot);
        u.searchParams.set('project', folder);
        return u.href;
      } catch (e) { return '#'; }
    }
    function openEdit(folder) { var u = editUrl(folder); if (u !== '#') window.open(u, '_blank', 'noopener'); }

    // ---- Filtering by collection (rail) + tags (facets) + name -------------
    var UNCOLLECTED = {};               // JS-only sentinel (never round-trips through the DOM)
    var activeColl = '';                // '' = all; UNCOLLECTED = uncollected; else a collection path
    var activeTags = [];                // selected tags (AND-combined)
    var textFilter = '';
    var railNodes = [];                 // rail button index → its collection value

    function collOf(p) { return p.collection || ''; }
    function inColl(p) {
      if (activeColl === UNCOLLECTED) return !collOf(p);
      if (!activeColl) return true;
      var c = collOf(p);
      return c === activeColl || c.indexOf(activeColl + '/') === 0;
    }
    function matches(p) {
      if (textFilter && (String(p.title || '')).toLowerCase().indexOf(textFilter) < 0) return false;
      if (!inColl(p)) return false;
      for (var i = 0; i < activeTags.length; i++) if ((p.tags || []).indexOf(activeTags[i]) < 0) return false;
      return true;
    }
    function countUnder(n) {
      return PROJECTS.filter(function (p) { var c = collOf(p); return c === n || c.indexOf(n + '/') === 0; }).length;
    }

    function renderRail() {
      var nodes = {}, uncollected = 0;
      PROJECTS.forEach(function (p) {
        var c = collOf(p);
        if (!c) { uncollected++; return; }
        var parts = c.split('/');
        for (var i = 1; i <= parts.length; i++) nodes[parts.slice(0, i).join('/')] = 1;
      });
      var items = [{ label: 'All sketches', value: '', depth: 0, count: PROJECTS.length }];
      Object.keys(nodes).sort().forEach(function (n) {
        items.push({ label: n.split('/').pop(), value: n, depth: n.split('/').length, count: countUnder(n) });
      });
      if (uncollected) items.push({ label: 'Uncollected', value: UNCOLLECTED, depth: 0, count: uncollected });
      railNodes = items;
      var rail = document.getElementById('rail');
      rail.innerHTML = items.map(function (it, i) {
        var active = (it.value === activeColl) ? ' active' : '';
        return '<button class="ri' + active + '" data-i="' + i + '" style="padding-left:' + (8 + it.depth * 14) + 'px">' +
               '<span>' + esc(it.label) + '</span><span class="n">' + it.count + '</span></button>';
      }).join('');
      rail.querySelectorAll('.ri').forEach(function (b) {
        b.addEventListener('click', function () { activeColl = railNodes[+b.dataset.i].value; activeTags = []; renderAll(); });
      });
    }

    function renderFacets() {
      var counts = {};
      PROJECTS.forEach(function (p) { if (inColl(p)) (p.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
      var tags = Object.keys(counts).sort();
      var el = document.getElementById('facets');
      if (!tags.length) { el.innerHTML = ''; el.style.display = 'none'; return; }
      el.style.display = '';
      el.innerHTML = tags.map(function (t) {
        var active = activeTags.indexOf(t) >= 0 ? ' active' : '';
        return '<button class="facet' + active + '" data-tag="' + esc(t) + '">' + esc(t) + ' <span class="fn">' + counts[t] + '</span></button>';
      }).join('');
      el.querySelectorAll('.facet').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = b.dataset.tag, i = activeTags.indexOf(t);
          if (i >= 0) activeTags.splice(i, 1); else activeTags.push(t);
          renderAll();
        });
      });
    }

    function cardHtml(p, idx) {
      var href = encodeURIComponent(p.folder) + '/';
      var title = esc(p.title);
      var thumb = p.hasThumb
        ? '<img loading="lazy" src="' + href + 'thumbnail.png" alt="' + title + '" />'
        : '<span class="thumb-ph">' + title + '</span>';
      var tags = p.tags.length
        ? '<div class="tags">' + p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '';
      var desc = p.excerpt ? '<p class="desc">' + esc(p.excerpt) + '</p>' : '';
      return '<article class="card">' +
        '<button class="thumb" data-detail="' + idx + '" aria-label="Details for ' + title + '">' + thumb + '</button>' +
        '<h2><button class="linkish" data-detail="' + idx + '">' + title + '</button></h2>' +
        tags + desc +
        '<div class="actions">' +
        '<a class="btn" href="' + href + '" target="_blank" rel="noopener" title="Run this sketch standalone">▶ Run</a>' +
        '<a class="btn primary" data-edit="' + idx + '" href="#" title="Open in a p5front editor">Edit</a>' +
        '</div></article>';
    }

    function renderGrid() {
      var html = '';
      PROJECTS.forEach(function (p, idx) { if (matches(p)) html += cardHtml(p, idx); });
      document.getElementById('grid').innerHTML = html || '<div class="empty">No sketches match.</div>';
    }

    function renderAll() { renderRail(); renderFacets(); renderGrid(); }

    document.getElementById('q').addEventListener('input', function (e) { textFilter = e.target.value.trim().toLowerCase(); renderGrid(); });

    var modal = document.getElementById('detail');
    function openDetail(idx) {
      var p = PROJECTS[idx];
      document.getElementById('d-title').textContent = p.title;
      document.getElementById('d-tags').innerHTML = p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      var tb = document.getElementById('d-thumb');
      tb.innerHTML = p.hasThumb ? '<img src="' + encodeURIComponent(p.folder) + '/thumbnail.png" alt="">' : '';
      tb.style.display = p.hasThumb ? '' : 'none';
      document.getElementById('d-desc').innerHTML = p.descHtml || '<p class="muted">No description.</p>';
      document.getElementById('d-run').href = runUrl(p.folder);
      document.getElementById('d-edit').onclick = function (e) { e.preventDefault(); openEdit(p.folder); };
      modal.style.display = 'flex';
    }
    function closeDetail() { modal.style.display = 'none'; }

    // Grid is re-rendered on every filter change, so use event delegation.
    document.getElementById('grid').addEventListener('click', function (e) {
      var d = e.target.closest('[data-detail]'), ed = e.target.closest('[data-edit]');
      if (ed) { e.preventDefault(); openEdit(PROJECTS[+ed.dataset.edit].folder); return; }
      if (d) openDetail(+d.dataset.detail);
    });
    document.getElementById('d-close').addEventListener('click', closeDetail);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeDetail(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });

    renderAll();
  })();
  </script>
</body>
</html>
