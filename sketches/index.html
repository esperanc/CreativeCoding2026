<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p5front projects</title>
  <style>
    :root { --fg:#1a1c20; --soft:#888; --line:#e2e5ea; --accent:#d63384; --card:#fff; --bg:#fafbfc; --soft-bg:#eef0f3; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1140px; margin: 0 auto; padding: 40px 20px; line-height: 1.5; background: var(--bg); color: var(--fg); }
    h1 { font-size: 1.5rem; margin: 0 0 .2rem; }
    .meta { color: var(--soft); font-size: .85rem; margin: 0 0 1rem; }
    .instance { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--soft); margin: 0 0 1.8rem; flex-wrap: wrap; }
    .instance input { font: inherit; font-size: .82rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 280px; flex: 1; }
    /* Browser: collection rail + main (filter, tag facets, grid) */
    .browser { display: grid; grid-template-columns: 200px 1fr; gap: 26px; align-items: start; }
    .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 2px; }
    .rail button { text-align: left; border: 0; background: none; font: inherit; color: var(--fg); cursor: pointer; padding: 6px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 8px; }
    .rail button:hover { background: var(--soft-bg); }
    .rail button.active { background: var(--accent); color: #fff; }
    .rail .n { color: var(--soft); font-size: .8em; }
    .rail button.active .n { color: rgba(255,255,255,.85); }
    .subhead { margin-bottom: 12px; }
    .subhead input { font: inherit; width: 100%; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    .facets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .facet { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 3px 11px; font-size: .78rem; cursor: pointer; }
    .facet:hover { border-color: var(--accent); }
    .facet.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .facet .fn { opacity: .7; }
    .empty { color: var(--soft); padding: 30px 4px; }
    @media (max-width: 640px) {
      .browser { grid-template-columns: 1fr; }
      .rail { position: static; flex-direction: row; flex-wrap: wrap; }
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .thumb { border: 0; padding: 0; cursor: pointer; display: block; width: 100%; aspect-ratio: 1 / 1; background: var(--soft-bg); overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-ph { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; padding: 12px; text-align: center; }
    .card h2 { font-size: 1rem; margin: 12px 14px 6px; }
    .linkish { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--fg); cursor: pointer; text-align: left; }
    .linkish:hover { color: var(--accent); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 14px 8px; }
    .tag { font-size: .72rem; color: var(--accent); background: rgba(214,51,132,.1); border-radius: 999px; padding: 2px 9px; }
    .desc { font-size: .82rem; color: var(--soft); margin: 0 14px 12px; }
    .actions { margin: auto 14px 14px; display: flex; gap: 8px; }
    .btn { flex: 1; text-align: center; font-size: .82rem; text-decoration: none; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); color: var(--fg); background: var(--card); cursor: pointer; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { color: #fff; opacity: .9; }
    /* Reading modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 10; }
    .sheet { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 680px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px 24px 24px; }
    .close { position: absolute; top: 12px; right: 12px; border: 0; background: none; font-size: 18px; color: var(--soft); cursor: pointer; }
    .d-thumb { border-radius: 10px; overflow: hidden; background: var(--soft-bg); margin-bottom: 14px; max-height: 340px; }
    .d-thumb img { width: 100%; height: auto; display: block; object-fit: contain; }
    .sheet h2 { margin: 0 0 8px; font-size: 1.3rem; }
    .d-actions { display: flex; gap: 10px; margin: 16px 0 4px; }
    .d-actions .btn { flex: 0 0 auto; padding: 8px 18px; }
    .md { color: var(--fg); font-size: .92rem; }
    .md h1, .md h2, .md h3 { margin: 1.1em 0 .4em; line-height: 1.25; }
    .md h1 { font-size: 1.25rem; } .md h2 { font-size: 1.1rem; } .md h3 { font-size: 1rem; }
    .md p { margin: .6em 0; }
    .md ul, .md ol { margin: .6em 0; padding-left: 1.4em; }
    .md code { background: var(--soft-bg); border-radius: 4px; padding: 1px 5px; font-size: .88em; }
    .md pre { background: var(--soft-bg); border-radius: 8px; padding: 12px; overflow-x: auto; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--soft); }
    .md a { color: var(--accent); }
    .muted { color: var(--soft); }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e6e8eb; --soft:#9aa0aa; --line:#2c313a; --accent:#ef6fb0; --card:#1c1f26; --bg:#16181d; --soft-bg:#23262e; }
    }
  </style>
</head>

  (function () {
    var PROJECTS = [{"folder":"p5 brush demo","title":"p5 brush demo","tags":["p5.brush"],"collection":"techniques/libraries","hasThumb":true,"descHtml":"\u003cp>The \"getting started\" demo for p5.brush.\u003cbr> See https://github.com/acamposuribe/p5.brush\u003c/p>","excerpt":"The \"getting started\" demo for p5.brush. See https://github.com/acamposuribe/p5.brush"},{"folder":"Design by subdivision","title":"Design by subdivision","tags":["catmull-clark","subdivision","hansmeyer","generative"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>This sketch is inspired by Michael Hansmeyer's work on design by subdivision, \u003cbr>in particular his Extended Catmull-Clark subdivision scheme, as detailed in the article\u003cbr>\"Design by Subdivision\" (http://archive.bridgesmathart.org/2010/bridges2010-167.pdf)\u003cbr>presented at the Bridges 2010 conference. Only the basic features \u003cbr>of this scheme were implemented, but enough to produce some interesting results.\u003c/p>\n\u003cp>Several other mesh operators are also implemented, including the original \u003cbr>Catmull-Clark subdivision algorithm (https://en.wikipedia.org/wiki/Catmull%E2%80%93Clark_subdivision_surface), \u003cbr>the Doo-Sabin subdivision algorithm (http://graphics.cs.ucdavis.edu/education/CAGDNotes/Doo-Sabin/Doo-Sabin.html), \u003cbr>vertex cutting, face extrusion, face center extrusion and the dual operator.\u003c/p>\n\u003cp>By default, the sketch starts in demo mode, where interesting results are \u003cbr>shown in rotation. Hit 'd' to toggle. \u003c/p>\n\u003cp>The several operations on solids, starting from one of the 5 platonic polyhedra,\u003cbr>can be applied in cascade using the interface panel.\u003c/p>","excerpt":"This sketch is inspired by Michael Hansmeyer's work on design by subdivision, in particular his Extended Catmull Clark subdivision scheme, as detailed in the…"},{"folder":"Global 2D Illumination","title":"Global 2D Illumination","tags":["generative","shader","global illumination","jump flooding"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>Follows the ideas in https://samuelbigos.github.io/posts/2dgi1-2d-global-illumination-in-godot.html about computing a global illumination in 2D using ray-marching and jump flooding.\u003c/p>\n\u003ch1>Usage\u003c/h1>\n\u003cp>Hit space to change the visualization between Illumination / Voronoi Diagram / Distance field\u003c/p>","excerpt":"Follows the ideas in https://samuelbigos.github.io/posts/2dgi1 2d global illumination in godot.html about computing a global illumination in 2D using ray…"},{"folder":"Particles with wallpaper groups","title":"Particles with wallpaper groups","tags":["flow fields","symmetry","wallpaper groups"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>Creates symmetric flow field patterns using wallpaper groups\u003c/p>\n\u003ch2>Keyboard commands:\u003c/h2>\n\u003cp>f : decrease fade factor (more opaque)\u003cbr>F : increase fade factor (more transparent)\u003c/p>\n\u003cul>\n\u003cli>: zoom in\u003c/li>\n\u003cli>: zoom out\u003c/li>\n\u003cp>G,g: New wallpaper group for the same field\u003c/p>\n\u003c/ul>\n\u003cblockquote>:  increases tile size\u003c/blockquote>\n\u003cp>&lt; :  decreases tile size\u003cbr>c,C: color scheme cycle\u003cbr>any other key: randomize\u003c/p>","excerpt":"Creates symmetric flow field patterns using wallpaper groups Keyboard commands: f : decrease fade factor (more opaque) F : increase fade factor (more…"},{"folder":"Deformable sprite sheets","title":"Deformable sprite sheets","tags":["concept","animation","sprites"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>Demonstrates the concept of using a sprite sheet generated by AI. Sprites are automatically extracted using image segmentation. Animation compounds mesh deformation and texture change.\u003c/p>\n\u003cp>No interaction\u003c/p>","excerpt":"Demonstrates the concept of using a sprite sheet generated by AI. Sprites are automatically extracted using image segmentation. Animation compounds mesh…"},{"folder":"Lava lamp","title":"Lava lamp","tags":["generative","ray marching","blob"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>A lava lamp implementation adapted from a shadertoy by Tupto at https://www.shadertoy.com/view/Wt3BWr\u003c/p>\n\u003ch1>Usage\u003c/h1>\n\u003cp>no interaction\u003c/p>","excerpt":"A lava lamp implementation adapted from a shadertoy by Tupto at https://www.shadertoy.com/view/Wt3BWr Usage no interaction"},{"folder":"RBF draw gpu","title":"RBF draw gpu","tags":["radial basis functions","shader","smooth curves"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>This shows how to create and draw closed curves modeled with radial basis functions (RBFs). Several kernels are supported.\u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cp>Click on the screen to add another control point\u003cbr>Click on an existing point to remove it\u003cbr>Click and drag an existing point to relocate it\u003cbr>Use the panel to change kernels\u003c/p>","excerpt":"This shows how to create and draw closed curves modeled with radial basis functions (RBFs). Several kernels are supported. Usage Click on the screen to add…"},{"folder":"curved fill","title":"curved fill","tags":["generative","bauhaus"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>A random fill using rounded corners. Inspired by Bauhaus posters...\u003c/p>\n\u003cp>Click to generate another\u003c/p>","excerpt":"A random fill using rounded corners. Inspired by Bauhaus posters... Click to generate another"},{"folder":"Segmentation","title":"Image Segmentation","tags":["image processing","connected components","generative","segmentation"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>This is a proof of concept implementation of a simple image segmentation strategy. Several circles rectangles and lines and the connected components created by their overlap are painted with assorted colors.\u003c/p>\n\u003cp>Click to generate another\u003c/p>","excerpt":"This is a proof of concept implementation of a simple image segmentation strategy. Several circles rectangles and lines and the connected components created by…"},{"folder":"symmetric icons","title":"symmetric icons","tags":["generative","symmetry","shader"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>Generates radially symmetric patterns.\u003c/p>\n\u003cp>Click to generate another\u003c/p>\n\u003ch2>keyboard commands\u003c/h2>\n\u003cp>d : toggles debug mode\u003c/p>\n\u003cblockquote>, &lt;: Zooms in / out\u003c/blockquote>\n\u003cp>+, - : increases / decreases color luminosity\u003cbr>p : cycles palette\u003cbr>3-9 : set symmetry \u003cbr>r : toggles reflection symmetry\u003cbr>q : toggles square mode\u003cbr>a : toggles auto demo\u003cbr>s : save image\u003c/p>","excerpt":"Generates radially symmetric patterns. Click to generate another keyboard commands d : toggles debug mode , \u003c: Zooms in / out +, : increases / decreases color…"},{"folder":"Mosaic animation","title":"Mosaic animation","tags":["generative","mosaic","animation","grain shader"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>Creates random mosaics using geometric shapes where tiles are animated\u003c/p>\n\u003ch2>Usage:\u003c/h2>\n\u003cp>Click to generate another\u003c/p>","excerpt":"Creates random mosaics using geometric shapes where tiles are animated Usage: Click to generate another"},{"folder":"Quilts with shaders","title":"Quilts with shaders","tags":["generative","shader","symmetry"],"collection":"generative","hasThumb":true,"descHtml":"\u003cp>Creates a symmetric pattern with random interation systems.\u003c/p>\n\u003cp>Click to generate another\u003c/p>\n\u003ch2>keyboard commands\u003c/h2>\n\u003cul>\n\u003cli>&gt;, &lt;: Zooms in / out\u003c/li>\n\u003cli>+, - : increases / decreases color luminosity\u003c/li>\n\u003cli>p : cycles palette\u003c/li>\n\u003cli>s : save image\u003c/li>\n\u003c/ul>","excerpt":"Creates a symmetric pattern with random interation systems. Click to generate another keyboard commands , \u003c: Zooms in / out +, : increases / decreases color…"},{"folder":"colored shapes","title":"colored shapes","tags":["concept","demo"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Illustrates P5's drawing commands and color stylization.\u003c/p>\n\u003cp>No interaction\u003c/p>","excerpt":"Illustrates P5's drawing commands and color stylization. No interaction"},{"folder":"tubes","title":"tubes","tags":["concept","texture","geometry"],"collection":"techniques","hasThumb":true,"descHtml":"\u003cp>Introduces code to generate textured tubes from line segments.\u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cp>The control panel lets you choose patterns and texturing parameters\u003c/p>","excerpt":"Introduces code to generate textured tubes from line segments. Usage The control panel lets you choose patterns and texturing parameters"},{"folder":"hershey font draw","title":"hershey font draw","tags":["typography","p5.brush"],"collection":"techniques/libraries","hasThumb":true,"descHtml":"\u003cp>Draws text using one of several Hershey Fonts. \u003cbr>Uses p5.brush \u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cp>Use the configuration panels\u003c/p>","excerpt":"Draws text using one of several Hershey Fonts. Uses p5.brush Usage Use the configuration panels"},{"folder":"Fidenza-like by Claude","title":"Fidenza-inspired By Claude.AI","tags":["Fidenza","Flow field","AI","Claude"],"collection":"aula 1","hasThumb":true,"descHtml":"\u003cp>Este sketch foi criado pelo Claude.AI (Opus 5 - Alto) usando o seguinte prompt:\u003c/p>\n\u003cp>Crie um sketch em p5.js inspirado na série Fidenza de Tyler Hobbs. Documente o código e mostre os fontes.\u003c/p>\n\u003ch2>Uso\u003c/h2>\n\u003cp>Use a interface embutida\u003c/p>","excerpt":"Este sketch foi criado pelo Claude.AI (Opus 5 Alto) usando o seguinte prompt: Crie um sketch em p5.js inspirado na série Fidenza de Tyler Hobbs. Documente o…"},{"folder":"shapes","title":"shapes","tags":["demo","concept"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Demonstrates P5's drawing commands\u003c/p>\n\u003cp>No interaction\u003c/p>","excerpt":"Demonstrates P5's drawing commands No interaction"},{"folder":"Non overlapping animated flowers","title":"Non overlapping animated flowers","tags":["generative","animation","concept"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Generates a bunch of _non overlapping_ \"flowers\" with random properties that are animated.\u003c/p>\n\u003cp>No interaction.\u003c/p>","excerpt":"Generates a bunch of non overlapping \"flowers\" with random properties that are animated. No interaction."},{"folder":"Non overlapping flowers","title":"Non overlapping flowers","tags":["generative","animation","concept"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Generates a bunch of _non overlapping_ \"flowers\" with random properties. \u003c/p>\n\u003cp>No interaction.\u003c/p>","excerpt":"Generates a bunch of non overlapping \"flowers\" with random properties. No interaction."},{"folder":"Random Flowers","title":"random flowers","tags":["generative","animation","concept"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Generates a bunch of \"flowers\" with random properties.\u003c/p>\n\u003cp>No interaction.\u003c/p>","excerpt":"Generates a bunch of \"flowers\" with random properties. No interaction."},{"folder":"gray grid","title":"gray grid","tags":["concept"],"collection":"aula 2","hasThumb":false,"descHtml":"\u003cp>Generates a grid of gray lines\u003c/p>\n\u003cp>No interaction\u003c/p>","excerpt":"Generates a grid of gray lines No interaction"},{"folder":"circle paint","title":"circle paint","tags":["concept","interactive"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Uses the mouse to paint transparent circles. Color depends on quadrant\u003c/p>","excerpt":"Uses the mouse to paint transparent circles. Color depends on quadrant"},{"folder":"scribbler","title":"scribbler","tags":["concept","interactive"],"collection":"aula 2","hasThumb":true,"descHtml":"\u003cp>Scribble using the mouse\u003c/p>\n\u003ch1>Usage\u003c/h1>\n\u003cul>\n\u003cli>Mouse drag: draws\u003c/li>\n\u003cli>Middle button: clears the screen\u003c/li>\n\u003c/ul>","excerpt":"Scribble using the mouse Usage Mouse drag: draws Middle button: clears the screen"},{"folder":"Composition 1","title":"composition 1","tags":["generative","ai","chatgpt","composition rules"],"collection":"aula 1","hasThumb":true,"descHtml":"\u003cp>Sketch created by Chat GPT for a creative coding class. \u003c/p>\n\u003cp>\u003cstrong>Author\u003c/strong>: Claudio Esperança\u003c/p>\n\u003cp>Here's the _prompt_\u003c/p>\n\u003cblockquote>Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. Use aleatoriedade mas de forma que a seguir regras de composição clássicas.\u003c/blockquote>","excerpt":"Sketch created by Chat GPT for a creative coding class. Author : Claudio Esperança Here's the prompt Crie um sketch estático (sem animação) em p5.js. Apresente…"}];
    var CANONICAL_DEFAULT = "https://esperanc.github.io/p5front/";
    var LS_KEY = 'p5front_gallery_instance';
    var repoRoot = ''; try { repoRoot = new URL('.', location.href).href; } catch (e) {}
    var urlInput = document.getElementById('p5front-url');
    urlInput.value = localStorage.getItem(LS_KEY) || CANONICAL_DEFAULT;
    urlInput.addEventListener('change', function () { localStorage.setItem(LS_KEY, urlInput.value.trim()); });

    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function runUrl(folder) { return encodeURIComponent(folder) + '/'; }
    function editUrl(folder) {
      var base = (urlInput.value || CANONICAL_DEFAULT).trim();
      try {
        var u = new URL(base);
        u.searchParams.set('repo', repoRoot);
        u.searchParams.set('project', folder);
        return u.href;
      } catch (e) { return '#'; }
    }
    function openEdit(folder) { var u = editUrl(folder); if (u !== '#') window.open(u, '_blank', 'noopener'); }

    // ---- Filtering by collection (rail) + tags (facets) + name -------------
    var UNCOLLECTED = {};               // JS-only sentinel (never round-trips through the DOM)
    var activeColl = '';                // '' = all; UNCOLLECTED = uncollected; else a collection path
    var activeTags = [];                // selected tags (AND-combined)
    var textFilter = '';
    var railNodes = [];                 // rail button index → its collection value

    function collOf(p) { return p.collection || ''; }
    function inColl(p) {
      if (activeColl === UNCOLLECTED) return !collOf(p);
      if (!activeColl) return true;
      var c = collOf(p);
      return c === activeColl || c.indexOf(activeColl + '/') === 0;
    }
    function matches(p) {
      if (textFilter && (String(p.title || '')).toLowerCase().indexOf(textFilter) < 0) return false;
      if (!inColl(p)) return false;
      for (var i = 0; i < activeTags.length; i++) if ((p.tags || []).indexOf(activeTags[i]) < 0) return false;
      return true;
    }
    function countUnder(n) {
      return PROJECTS.filter(function (p) { var c = collOf(p); return c === n || c.indexOf(n + '/') === 0; }).length;
    }

    function renderRail() {
      var nodes = {}, uncollected = 0;
      PROJECTS.forEach(function (p) {
        var c = collOf(p);
        if (!c) { uncollected++; return; }
        var parts = c.split('/');
        for (var i = 1; i <= parts.length; i++) nodes[parts.slice(0, i).join('/')] = 1;
      });
      var items = [{ label: 'All sketches', value: '', depth: 0, count: PROJECTS.length }];
      Object.keys(nodes).sort().forEach(function (n) {
        items.push({ label: n.split('/').pop(), value: n, depth: n.split('/').length, count: countUnder(n) });
      });
      if (uncollected) items.push({ label: 'Uncollected', value: UNCOLLECTED, depth: 0, count: uncollected });
      railNodes = items;
      var rail = document.getElementById('rail');
      rail.innerHTML = items.map(function (it, i) {
        var active = (it.value === activeColl) ? ' active' : '';
        return '<button class="ri' + active + '" data-i="' + i + '" style="padding-left:' + (8 + it.depth * 14) + 'px">' +
               '<span>' + esc(it.label) + '</span><span class="n">' + it.count + '</span></button>';
      }).join('');
      rail.querySelectorAll('.ri').forEach(function (b) {
        b.addEventListener('click', function () { activeColl = railNodes[+b.dataset.i].value; activeTags = []; renderAll(); });
      });
    }

    function renderFacets() {
      var counts = {};
      PROJECTS.forEach(function (p) { if (inColl(p)) (p.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
      var tags = Object.keys(counts).sort();
      var el = document.getElementById('facets');
      if (!tags.length) { el.innerHTML = ''; el.style.display = 'none'; return; }
      el.style.display = '';
      el.innerHTML = tags.map(function (t) {
        var active = activeTags.indexOf(t) >= 0 ? ' active' : '';
        return '<button class="facet' + active + '" data-tag="' + esc(t) + '">' + esc(t) + ' <span class="fn">' + counts[t] + '</span></button>';
      }).join('');
      el.querySelectorAll('.facet').forEach(function (b) {
        b.addEventListener('click', function () {
          var t = b.dataset.tag, i = activeTags.indexOf(t);
          if (i >= 0) activeTags.splice(i, 1); else activeTags.push(t);
          renderAll();
        });
      });
    }

    function cardHtml(p, idx) {
      var href = encodeURIComponent(p.folder) + '/';
      var title = esc(p.title);
      var thumb = p.hasThumb
        ? '<img loading="lazy" src="' + href + 'thumbnail.png" alt="' + title + '" />'
        : '<span class="thumb-ph">' + title + '</span>';
      var tags = p.tags.length
        ? '<div class="tags">' + p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '';
      var desc = p.excerpt ? '<p class="desc">' + esc(p.excerpt) + '</p>' : '';
      return '<article class="card">' +
        '<button class="thumb" data-detail="' + idx + '" aria-label="Details for ' + title + '">' + thumb + '</button>' +
        '<h2><button class="linkish" data-detail="' + idx + '">' + title + '</button></h2>' +
        tags + desc +
        '<div class="actions">' +
        '<a class="btn" href="' + href + '" target="_blank" rel="noopener" title="Run this sketch standalone">▶ Run</a>' +
        '<a class="btn primary" data-edit="' + idx + '" href="#" title="Open in a p5front editor">Edit</a>' +
        '</div></article>';
    }

    function renderGrid() {
      var html = '';
      PROJECTS.forEach(function (p, idx) { if (matches(p)) html += cardHtml(p, idx); });
      document.getElementById('grid').innerHTML = html || '<div class="empty">No sketches match.</div>';
    }

    function renderAll() { renderRail(); renderFacets(); renderGrid(); }

    document.getElementById('q').addEventListener('input', function (e) { textFilter = e.target.value.trim().toLowerCase(); renderGrid(); });

    var modal = document.getElementById('detail');
    function openDetail(idx) {
      var p = PROJECTS[idx];
      document.getElementById('d-title').textContent = p.title;
      document.getElementById('d-tags').innerHTML = p.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      var tb = document.getElementById('d-thumb');
      tb.innerHTML = p.hasThumb ? '<img src="' + encodeURIComponent(p.folder) + '/thumbnail.png" alt="">' : '';
      tb.style.display = p.hasThumb ? '' : 'none';
      document.getElementById('d-desc').innerHTML = p.descHtml || '<p class="muted">No description.</p>';
      document.getElementById('d-run').href = runUrl(p.folder);
      document.getElementById('d-edit').onclick = function (e) { e.preventDefault(); openEdit(p.folder); };
      modal.style.display = 'flex';
    }
    function closeDetail() { modal.style.display = 'none'; }

    // Grid is re-rendered on every filter change, so use event delegation.
    document.getElementById('grid').addEventListener('click', function (e) {
      var d = e.target.closest('[data-detail]'), ed = e.target.closest('[data-edit]');
      if (ed) { e.preventDefault(); openEdit(PROJECTS[+ed.dataset.edit].folder); return; }
      if (d) openDetail(+d.dataset.detail);
    });
    document.getElementById('d-close').addEventListener('click', closeDetail);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeDetail(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });

    renderAll();
  })();
  </script>
</body>
</html>
