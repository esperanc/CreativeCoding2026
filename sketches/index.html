<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p5front projects</title>
  <style>
    :root { --fg:#1a1c20; --soft:#888; --line:#e2e5ea; --accent:#d63384; --card:#fff; --bg:#fafbfc; --soft-bg:#eef0f3; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1140px; margin: 0 auto; padding: 40px 20px; line-height: 1.5; background: var(--bg); color: var(--fg); }
    h1 { font-size: 1.5rem; margin: 0 0 .2rem; }
    .meta { color: var(--soft); font-size: .85rem; margin: 0 0 1rem; }
    .instance { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--soft); margin: 0 0 1.8rem; flex-wrap: wrap; }
    .instance input { font: inherit; font-size: .82rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 280px; flex: 1; }
    /* Browser: collection rail + main (filter, tag facets, grid) */
    .browser { display: grid; grid-template-columns: 200px 1fr; gap: 26px; align-items: start; }
    .rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 2px; }
    .rail button { text-align: left; border: 0; background: none; font: inherit; color: var(--fg); cursor: pointer; padding: 6px 10px; border-radius: 7px; display: flex; justify-content: space-between; gap: 8px; }
    .rail button:hover { background: var(--soft-bg); }
    .rail button.active { background: var(--accent); color: #fff; }
    .rail .n { color: var(--soft); font-size: .8em; }
    .rail button.active .n { color: rgba(255,255,255,.85); }
    .subhead { margin-bottom: 12px; }
    .subhead input { font: inherit; width: 100%; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    .facets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .facet { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 3px 11px; font-size: .78rem; cursor: pointer; }
    .facet:hover { border-color: var(--accent); }
    .facet.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .facet .fn { opacity: .7; }
    .empty { color: var(--soft); padding: 30px 4px; }
    @media (max-width: 640px) {
      .browser { grid-template-columns: 1fr; }
      .rail { position: static; flex-direction: row; flex-wrap: wrap; }
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .thumb { border: 0; padding: 0; cursor: pointer; display: block; width: 100%; aspect-ratio: 1 / 1; background: var(--soft-bg); overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-ph { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; padding: 12px; text-align: center; }
    .card h2 { font-size: 1rem; margin: 12px 14px 6px; }
    .linkish { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--fg); cursor: pointer; text-align: left; }
    .linkish:hover { color: var(--accent); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 14px 8px; }
    .tag { font-size: .72rem; color: var(--accent); background: rgba(214,51,132,.1); border-radius: 999px; padding: 2px 9px; }
    .desc { font-size: .82rem; color: var(--soft); margin: 0 14px 12px; }
    .actions { margin: auto 14px 14px; display: flex; gap: 8px; }
    .btn { flex: 1; text-align: center; font-size: .82rem; text-decoration: none; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); color: var(--fg); background: var(--card); cursor: pointer; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { color: #fff; opacity: .9; }
    /* Reading modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 10; }
    .sheet { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 680px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px 24px 24px; }
    .close { position: absolute; top: 12px; right: 12px; border: 0; background: none; font-size: 18px; color: var(--soft); cursor: pointer; }
    .d-thumb { border-radius: 10px; overflow: hidden; background: var(--soft-bg); margin-bottom: 14px; max-height: 340px; }
    .d-thumb img { width: 100%; height: auto; display: block; object-fit: contain; }
    .sheet h2 { margin: 0 0 8px; font-size: 1.3rem; }
    .d-actions { display: flex; gap: 10px; margin: 16px 0 4px; }
    .d-actions .btn { flex: 0 0 auto; padding: 8px 18px; }
    .md { color: var(--fg); font-size: .92rem; }
    .md h1, .md h2, .md h3 { margin: 1.1em 0 .4em; line-height: 1.25; }
    .md h1 { font-size: 1.25rem; } .md h2 { font-size: 1.1rem; } .md h3 { font-size: 1rem; }
    .md p { margin: .6em 0; }
    .md ul, .md ol { margin: .6em 0; padding-left: 1.4em; }
    .md code { background: var(--soft-bg); border-radius: 4px; padding: 1px 5px; font-size: .88em; }
    .md pre { background: var(--soft-bg); border-radius: 8px; padding: 12px; overflow-x: auto; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--soft); }
    .md a { color: var(--accent); }
    .muted { color: var(--soft); }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e6e8eb; --soft:#9aa0aa; --line:#2c313a; --accent:#ef6fb0; --card:#1c1f26; --bg:#16181d; --soft-bg:#23262e; }
    }
  </style>
</head>

  <script>
  (function () {
    var PROJECTS = [{"folder":"artefato1-pedropaulo","title":"Caquinhos","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Nome: Pedro Paulo de Oliveira Rocha - DRE:121050964\u003c/p>\n\u003cp>Um mosaico de arte generativa em p5.js formado por quadriláteros irregulares em terracota, branco e preto, revelando um fundo azul marinho através de suas frestas caóticas.\u003c/p>","excerpt":"Nome: Pedro Paulo de Oliveira Rocha DRE:121050964 Um mosaico de arte generativa em p5.js formado por quadriláteros irregulares em terracota, branco e preto,…"},{"folder":"vaporwave","title":"Vaporwave em Quads","tags":["quads","IA","ChatGPT","Generative"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um Sketch feito pelo ChatGPT usando apenas Quads.\u003cbr>Autor: Ysabelle Estevão de Oliveira\u003cbr>Prompot usado: Crie um sketch estático (sem animação) em p5.js. Apresente o  resultado sob a forma de um único script em javascript a ser colado num  ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar  como primitiva de desenho apenas o comando quad. É permitido usar  comandos de estilização como stroke, fill, strokeWeight, etc. O programa  fonte deve ser documentado para ser explicado para uma plateia de  iniciantes em programação de computadores.  Gostaria que fosse criado com o codigo uma arte estilo vaporwave, com bastante neon e elementos de programas antigos de computador como por exemplo o windows 98.\u003c/p>","excerpt":"Um Sketch feito pelo ChatGPT usando apenas Quads. Autor: Ysabelle Estevão de Oliveira Prompot usado: Crie um sketch estático (sem animação) em p5.js. Apresente…"},{"folder":"Trab1 ProgCriativa HAlmico","title":"Composição neoconcreta com quads","tags":["quads","ai","claude","generative"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo Claude usando apenas quads.\u003c/p>\n\u003cp>Autor: Henrique Almico Dias da Silva\u003c/p>\n\u003cp>Prompt usado: Crie um sketch estático (sem animação) em p5.js, em um único script para colar no editor.p5js.org. Use apenas o comando quad como primitiva de desenho (stroke, fill, strokeWeight e transparência são permitidos para estilização). A composição deve ter inspiração neoconcreta: fundo escuro sofisticado, paleta pastel com uma única cor vibrante de destaque, formas dispostas em diagonal (evitando grades retas), proporções variadas (de finas e alongadas a robustas) e sobreposições com transparência para gerar novos tons nas interseções. O código deve ser bem documentado em português, explicando a lógica matemática por trás da distorção dos vértices e as escolhas de composição, de forma acessível a iniciantes.\u003c/p>","excerpt":"Um sketch feito pelo Claude usando apenas quads. Autor: Henrique Almico Dias da Silva Prompt usado: Crie um sketch estático (sem animação) em p5.js, em um…"},{"folder":"EEL880 artefato1 Gabriel Rodrigues da Silva","title":"Composição no estilo cyberpunk com quads","tags":["quads","ai","gemini","generative","cyberpunk"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo Gemini usando apenas quads, contendo algumas adições pessoais. \u003c/p>\n\u003cp>Autor: Gabriel Rodrigues da Silva\u003cbr>DRE: 121044858\u003c/p>\n\u003cp>Para a construção desse trabalho, foram usados vários prompts, partindo de um código inicial gerado pelo Gemini 3.1 Pro.\u003c/p>\n\u003cp>1º prompt:\u003c/p>\n\u003cpre>\u003ccode>Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores.\n\nTente criar uma arte com cores parecidas com um tema de cyberpunk (subgênero distópico de ficção científica), com contrastes e cores vibrantes. Se possível, crie uma seed aleatória antes de começar a desenhar a cena com os quadrados. \n\nPor fim, para deixar o trabalho diferente, reserve um pequeno espaço no canto inferior direito do canvas e desenhe um celular de botão, parecido com aqueles de antigamente com uma tela e 12 botões. Lembrando que esse \"celular\" precisa ser feito inteiramente de quadrados com o quad() ! Não precisa ficar tão bonito ou detalhado, visto que temos algumas limitações por ser o primeiro trabalho de uma disciplina que estou cursando.\u003c/code>\u003c/pre>\n\u003cp>1º código gerado:\u003c/p>\n\u003cpre>\u003ccode>/*\n  CENÁRIO CYBERPUNK COM CELULAR RETRÔ\n  ----------------------------------------\n\n  Este programa cria uma arte abstrata inspirada no gênero \"Cyberpunk\",\n  caracterizado por cenários noturnos, distópicos e com muitas luzes neon \n  (cores vibrantes e de alto contraste como magenta, ciano e amarelo).\n\n  REGRA PRINCIPAL: A única função geométrica permitida para desenhar \n  as formas é o quad() - um polígono de quatro lados. \n\n  Para iniciantes em programação:\n  - Variáveis (let): Guardam valores que podemos usar várias vezes.\n  - Arrays ([]): Guardam listas de valores, como nossa paleta de cores.\n  - Laço de repetição (for): Executa um bloco de código repetidas vezes,\n    poupando a necessidade de escrever dezenas de linhas de código.\n  - quad(x1,y1, x2,y2, x3,y3, x4,y4): Cada par de (x,y) representa a \n    posição de uma \"ponta\" do quadrilátero na nossa tela.\n*/\n\nfunction setup() {\n  // createCanvas define o tamanho do nosso quadro (largura, altura).\n  createCanvas(800, 800);\n  \n  // noLoop avisa o p5.js que este é um desenho estático, \n  // ou seja, não precisa ser atualizado continuamente como uma animação.\n  noLoop();\n  \n  // randomSeed congela a aleatoriedade. O número \"2077\" (uma brincadeira \n  // com o jogo Cyberpunk 2077) funciona como uma \"semente\". Isso garante \n  // que toda vez que você der play, os quadrados aleatórios ficarão \n  // exatamente no mesmo lugar.\n  randomSeed(2077);\n  \n  // background pinta o fundo do quadro. Usamos um azul escuro/cinza \n  // quase preto para simular a noite da cidade.\n  background(\"#0a0b14\");\n\n  // 1. DESENHANDO O FUNDO CYBERPUNK (Prédios e luzes abstratas)\n  desenharFundoNeon();\n\n  // 2. DESENHANDO O CELULAR RETRÔ (No canto inferior direito)\n  desenharCelularRetro();\n}\n\n/*\n  FUNÇÃO: desenharFundoNeon()\n  Cria uma série de quadriláteros aleatórios espalhados pela tela\n  para simular luzes, hologramas e blocos de concreto de uma metrópole.\n*/\nfunction desenharFundoNeon() {\n  // Paleta de cores neon para as luzes da cidade\n  let coresNeon = [\n    \"#ff00ff\", // Magenta\n    \"#00ffff\", // Ciano\n    \"#ffff00\", // Amarelo\n    \"#00ff66\", // Verde Neon\n    \"#222233\"  // Cinza escuro (para contraste de prédios no fundo)\n  ];\n\n  // Vamos usar um laço de repetição para desenhar 60 quadriláteros\n  for (let i = 0; i &lt; 60; i++) {\n    // Escolhemos uma posição base X e Y de forma aleatória\n    let x = random(0, width);\n    let y = random(0, height);\n    \n    // Sorteamos a largura e a altura desse polígono\n    let w = random(20, 200);\n    let h = random(20, 200);\n    \n    // Para deixar as formas mais caóticas (Cyberpunk não é perfeitinho!),\n    // adicionamos uma deformação (inclinação) para cada ponto.\n    let deformacao = random(-40, 40);\n\n    // Sorteamos uma cor da nossa paleta usando a função random() com a lista\n    let corEscolhida = random(coresNeon);\n    \n    // fill() define a cor do preenchimento da forma\n    fill(corEscolhida);\n    \n    // Dependendo da cor, mexemos na borda para criar um efeito de contorno brilhante\n    if (corEscolhida === \"#222233\") {\n      stroke(\"#000000\"); // Bordas escuras para os blocos escuros\n      strokeWeight(1);\n    } else {\n      stroke(255); // Bordas brancas brilhantes para o neon\n      strokeWeight(2);\n    }\n\n    // Finalmente, desenhamos o quadrilátero com os 4 pontos calculados\n    quad(\n      x, y,                              // Ponto 1 (Superior Esquerdo)\n      x + w, y + deformacao,             // Ponto 2 (Superior Direito)\n      x + w - deformacao, y + h,         // Ponto 3 (Inferior Direito)\n      x - deformacao, y + h + deformacao // Ponto 4 (Inferior Esquerdo)\n    );\n  }\n}\n\n/*\n  FUNÇÃO: desenharCelularRetro()\n  Desenha o celular \"tijolão\" usando apenas quad(), posicionando-o \n  no canto inferior direito da nossa tela (x a partir de 620, y a partir de 520).\n*/\nfunction desenharCelularRetro() {\n  // Posições iniciais (base) do celular para facilitar a conta\n  let baseX = 640;\n  let baseY = 500;\n  \n  // --- CORPO DO CELULAR ---\n  fill(\"#111111\");     // Corpo preto de plástico\n  stroke(\"#ff00ff\");   // Borda magenta estilosa para combinar com o fundo\n  strokeWeight(3);\n  \n  // Um retângulo convencional usando quad (ângulos retos)\n  quad(\n    baseX, baseY,               // Topo-esquerda\n    baseX + 120, baseY,         // Topo-direita\n    baseX + 120, baseY + 260,   // Embaixo-direita\n    baseX, baseY + 260          // Embaixo-esquerda\n  );\n\n  // --- TELA DO CELULAR ---\n  fill(\"#003300\");     // Cor verde escura clássica das telas de cristal líquido (LCD) antigas\n  stroke(\"#00ff66\");   // Borda iluminada verde-neon\n  strokeWeight(2);\n\n  quad(\n    baseX + 15, baseY + 20,     // Topo-esquerda da tela\n    baseX + 105, baseY + 20,    // Topo-direita da tela\n    baseX + 105, baseY + 100,   // Embaixo-direita da tela\n    baseX + 15, baseY + 100     // Embaixo-esquerda da tela\n  );\n\n  // --- BOTÕES DO CELULAR (12 botões num teclado 3x4) ---\n  // Vamos usar dois laços de repetição (um dentro do outro) para\n  // criar uma pequena grade para o teclado sem escrever o quad() 12 vezes.\n  \n  fill(\"#333333\");     // Cor de preenchimento dos botões\n  stroke(\"#00ffff\");   // Borda ciano neon para dar leitura no escuro\n  strokeWeight(1.5);\n  \n  // Laço das Linhas (4 linhas no celular)\n  for (let linha = 0; linha &lt; 4; linha++) {\n    // Laço das Colunas (3 colunas no celular)\n    for (let coluna = 0; coluna &lt; 3; coluna++) {\n      \n      // Calculamos a posição de cada botão com base na linha e na coluna atuais\n      // baseX + 22 (margem esquerda) + espaçamento das colunas\n      let botaoX = baseX + 22 + (coluna * 30);\n      // baseY + 130 (espaço abaixo da tela) + espaçamento das linhas\n      let botaoY = baseY + 130 + (linha * 25);\n      \n      let larguraBotao = 20;\n      let alturaBotao = 12;\n      \n      // Desenha o botãozinho atual, formando um retângulo usando quad()\n      quad(\n        botaoX, botaoY,                               // Sup-Esq\n        botaoX + larguraBotao, botaoY,                // Sup-Dir\n        botaoX + larguraBotao, botaoY + alturaBotao,  // Inf-Dir\n        botaoX, botaoY + alturaBotao                  // Inf-Esq\n      );\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>2º prompt:\u003c/p>\n\u003cpre>\u003ccode>A arte ficou meio embolada, com quadrados se sobrepondo e com formas muito irregulares (quase triangulares). Tente suavizar um pouco essas variações no desenho dos quadrados.\u003c/code>\u003c/pre>\n\u003cp>2º código gerado:\u003c/p>\n\u003cp>Aqui está a versão ajustada do código!\u003c/p>\n\u003cp>Para resolver o problema das formas \"emboladas\" e quase triangulares, reduzi a quantidade de quadrados no fundo (de 60 para 35) para deixar a cena mais limpa. Além disso, mudei a forma como a \"deformação\" é calculada: em vez de um deslocamento muito drástico que cruzava as linhas e quebrava a forma, agora aplicamos apenas um leve \"tremor\" (uma pequena variação aleatória de no máximo 10 pixels) em cada ponta. Isso mantém a estética de blocos urbanos, mas garante que eles continuem parecendo quadriláteros.\u003c/p>\n\u003cpre>\u003ccode>/*\n  CENÁRIO CYBERPUNK COM CELULAR RETRÔ (Versão Suavizada)\n  ------------------------------------------------------\n\n  Este programa cria uma arte abstrata inspirada no gênero \"Cyberpunk\",\n  caracterizado por cenários noturnos, distópicos e com muitas luzes neon \n  (cores vibrantes e de alto contraste como magenta, ciano e amarelo).\n\n  Nesta versão, as deformações dos quadriláteros foram suavizadas para \n  evitar formas irreconhecíveis e a quantidade de elementos foi reduzida \n  para melhorar a clareza visual da composição.\n\n  REGRA PRINCIPAL: A única função geométrica permitida para desenhar \n  as formas é o quad() - um polígono de quatro lados. \n\n  Para iniciantes em programação:\n  - Variáveis (let): Guardam valores que podemos usar várias vezes.\n  - Arrays ([]): Guardam listas de valores, como nossa paleta de cores.\n  - Laço de repetição (for): Executa um bloco de código repetidas vezes,\n    poupando a necessidade de escrever dezenas de linhas de código.\n  - quad(x1,y1, x2,y2, x3,y3, x4,y4): Cada par de (x,y) representa a \n    posição de uma \"ponta\" do quadrilátero na nossa tela.\n*/\n\nfunction setup() {\n  // createCanvas define o tamanho do nosso quadro (largura, altura).\n  createCanvas(800, 800);\n  \n  // noLoop avisa o p5.js que este é um desenho estático, \n  // ou seja, não precisa ser atualizado continuamente.\n  noLoop();\n  \n  // randomSeed congela a aleatoriedade. O número \"2077\" garante que\n  // toda vez que você der play, o desenho gerado será exatamente o mesmo.\n  randomSeed(2077);\n  \n  // background pinta o fundo do quadro com um azul escuro/cinza.\n  background(\"#0a0b14\");\n\n  // 1. DESENHANDO O FUNDO CYBERPUNK (Prédios e luzes abstratas)\n  desenharFundoNeon();\n\n  // 2. DESENHANDO O CELULAR RETRÔ (No canto inferior direito)\n  desenharCelularRetro();\n}\n\n/*\n  FUNÇÃO: desenharFundoNeon()\n  Cria uma série de quadriláteros espalhados pela tela.\n  As formas possuem pequenas variações para não serem retângulos perfeitos,\n  mas mantêm sua estrutura básica para não virarem triângulos bagunçados.\n*/\nfunction desenharFundoNeon() {\n  // Paleta de cores neon para as luzes da cidade\n  let coresNeon = [\n    \"#ff00ff\", // Magenta\n    \"#00ffff\", // Ciano\n    \"#ffff00\", // Amarelo\n    \"#00ff66\", // Verde Neon\n    \"#222233\"  // Cinza escuro (para contraste e profundidade)\n  ];\n\n  // Reduzimos o número de formas para 35, para a cena \"respirar\" mais\n  for (let i = 0; i &lt; 35; i++) {\n    // Escolhemos uma posição base X e Y de forma aleatória\n    let x = random(20, width - 150);\n    let y = random(20, height - 150);\n    \n    // Sorteamos a largura e a altura desse bloco\n    let w = random(40, 160);\n    let h = random(40, 160);\n    \n    // Em vez de uma grande deformação estrutural, usamos um \"tremor\" leve.\n    // Cada vértice do quadrado vai sair do lugar no máximo 10 pixels.\n    let tremor = 10;\n\n    // Sorteamos uma cor da nossa paleta\n    let corEscolhida = random(coresNeon);\n    fill(corEscolhida);\n    \n    // Dependendo da cor, ajustamos o contorno\n    if (corEscolhida === \"#222233\") {\n      stroke(\"#000000\"); // Bordas escuras para os blocos escuros\n      strokeWeight(2);\n    } else {\n      stroke(255); // Bordas brancas brilhantes para o neon\n      strokeWeight(1.5);\n    }\n\n    // Desenhamos o quadrilátero adicionando o leve \"tremor\" em cada ponto\n    quad(\n      x + random(-tremor, tremor), y + random(-tremor, tremor),                         // Ponto 1 (Superior Esquerdo)\n      x + w + random(-tremor, tremor), y + random(-tremor, tremor),                     // Ponto 2 (Superior Direito)\n      x + w + random(-tremor, tremor), y + h + random(-tremor, tremor),                 // Ponto 3 (Inferior Direito)\n      x + random(-tremor, tremor), y + h + random(-tremor, tremor)                      // Ponto 4 (Inferior Esquerdo)\n    );\n  }\n}\n\n/*\n  FUNÇÃO: desenharCelularRetro()\n  Desenha o celular \"tijolão\" usando apenas quad(), posicionando-o \n  no canto inferior direito da nossa tela.\n*/\nfunction desenharCelularRetro() {\n  // Posições iniciais (base) do celular para facilitar a conta\n  let baseX = 640;\n  let baseY = 500;\n  \n  // --- CORPO DO CELULAR ---\n  fill(\"#111111\");     // Corpo preto de plástico\n  stroke(\"#ff00ff\");   // Borda magenta estilosa para combinar com o fundo\n  strokeWeight(3);\n  \n  // Um retângulo convencional usando quad (ângulos retos)\n  quad(\n    baseX, baseY,               // Topo-esquerda\n    baseX + 120, baseY,         // Topo-direita\n    baseX + 120, baseY + 260,   // Embaixo-direita\n    baseX, baseY + 260          // Embaixo-esquerda\n  );\n\n  // --- TELA DO CELULAR ---\n  fill(\"#003300\");     // Cor verde escura clássica das telas de LCD\n  stroke(\"#00ff66\");   // Borda iluminada verde-neon\n  strokeWeight(2);\n\n  quad(\n    baseX + 15, baseY + 20,     // Topo-esquerda da tela\n    baseX + 105, baseY + 20,    // Topo-direita da tela\n    baseX + 105, baseY + 100,   // Embaixo-direita da tela\n    baseX + 15, baseY + 100     // Embaixo-esquerda da tela\n  );\n\n  // --- BOTÕES DO CELULAR (12 botões num teclado 3x4) ---\n  fill(\"#333333\");     // Cor de preenchimento dos botões\n  stroke(\"#00ffff\");   // Borda ciano neon para dar leitura no escuro\n  strokeWeight(1.5);\n  \n  // Laço das Linhas (4 linhas no celular)\n  for (let linha = 0; linha &lt; 4; linha++) {\n    // Laço das Colunas (3 colunas no celular)\n    for (let coluna = 0; coluna &lt; 3; coluna++) {\n      \n      // Calculamos a posição de cada botão com base na linha e na coluna atuais\n      let botaoX = baseX + 22 + (coluna * 30);\n      let botaoY = baseY + 130 + (linha * 25);\n      \n      let larguraBotao = 20;\n      let alturaBotao = 12;\n      \n      // Desenha o botãozinho atual, formando um retângulo estrito usando quad()\n      quad(\n        botaoX, botaoY,                               // Sup-Esq\n        botaoX + larguraBotao, botaoY,                // Sup-Dir\n        botaoX + larguraBotao, botaoY + alturaBotao,  // Inf-Dir\n        botaoX, botaoY + alturaBotao                  // Inf-Esq\n      );\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>3º prompt:\u003c/p>\n\u003cpre>\u003ccode>Ficou melhor, mas agora ficou muito concentrado no meio. Pode espalhar mais esses quadrados nas laterais. \u003c/code>\u003c/pre>\n\u003cp>3º código gerado:\u003c/p>\n\u003cpre>\u003ccode>/*\n  CENÁRIO CYBERPUNK COM CELULAR RETRÔ (Laterais Preenchidas)\n  ----------------------------------------------------------\n\n  Este programa cria uma arte abstrata inspirada no gênero \"Cyberpunk\",\n  caracterizado por cenários noturnos, distópicos e com muitas luzes neon.\n\n  Nesta versão, ajustamos as coordenadas de geração dos quadrados do fundo\n  para que eles se espalhem por toda a tela, inclusive ultrapassando as \n  bordas (sangria), evitando que fiquem concentrados apenas no meio.\n\n  REGRA PRINCIPAL: A única função geométrica permitida para desenhar \n  as formas é o quad() - um polígono de quatro lados. \n\n  Para iniciantes em programação:\n  - Variáveis (let): Guardam valores que podemos usar várias vezes.\n  - Arrays ([]): Guardam listas de valores, como nossa paleta de cores.\n  - Laço de repetição (for): Executa um bloco de código repetidas vezes,\n    poupando a necessidade de escrever dezenas de linhas de código.\n  - quad(x1,y1, x2,y2, x3,y3, x4,y4): Cada par de (x,y) representa a \n    posição de uma \"ponta\" do quadrilátero na nossa tela.\n*/\n\nfunction setup() {\n  // createCanvas define o tamanho do nosso quadro (largura, altura).\n  createCanvas(800, 800);\n  \n  // noLoop avisa o p5.js que este é um desenho estático, \n  // ou seja, não precisa ser atualizado continuamente.\n  noLoop();\n  \n  // randomSeed congela a aleatoriedade. O número \"2077\" garante que\n  // toda vez que você der play, o desenho gerado será exatamente o mesmo.\n  randomSeed(2077);\n  \n  // background pinta o fundo do quadro com um azul escuro/cinza.\n  background(\"#0a0b14\");\n\n  // 1. DESENHANDO O FUNDO CYBERPUNK (Prédios e luzes abstratas)\n  desenharFundoNeon();\n\n  // 2. DESENHANDO O CELULAR RETRÔ (No canto inferior direito)\n  desenharCelularRetro();\n}\n\n/*\n  FUNÇÃO: desenharFundoNeon()\n  Cria uma série de quadriláteros espalhados pela tela.\n  Os limites de posição foram expandidos para além das bordas (valores negativos \n  e maiores que width/height) para garantir que as laterais também sejam preenchidas.\n*/\nfunction desenharFundoNeon() {\n  // Paleta de cores neon para as luzes da cidade\n  let coresNeon = [\n    \"#ff00ff\", // Magenta\n    \"#00ffff\", // Ciano\n    \"#ffff00\", // Amarelo\n    \"#00ff66\", // Verde Neon\n    \"#222233\"  // Cinza escuro (para contraste e profundidade)\n  ];\n\n  // Aumentamos levemente a quantidade (para 45) para preencher a área maior\n  for (let i = 0; i &lt; 45; i++) {\n    // Expandimos a área de sorteio para -50 até width+50 / height+50\n    // Isso faz com que os quadrados se espalhem por toda a extensão do canvas\n    let x = random(-50, width + 50);\n    let y = random(-50, height + 50);\n    \n    // Sorteamos a largura e a altura desse bloco\n    let w = random(40, 160);\n    let h = random(40, 160);\n    \n    // Em vez de uma grande deformação estrutural, usamos um \"tremor\" leve.\n    // Cada vértice do quadrado vai sair do lugar no máximo 10 pixels.\n    let tremor = 10;\n\n    // Sorteamos uma cor da nossa paleta\n    let corEscolhida = random(coresNeon);\n    fill(corEscolhida);\n    \n    // Dependendo da cor, ajustamos o contorno\n    if (corEscolhida === \"#222233\") {\n      stroke(\"#000000\"); // Bordas escuras para os blocos escuros\n      strokeWeight(2);\n    } else {\n      stroke(255); // Bordas brancas brilhantes para o neon\n      strokeWeight(1.5);\n    }\n\n    // Desenhamos o quadrilátero adicionando o leve \"tremor\" em cada ponto\n    quad(\n      x + random(-tremor, tremor), y + random(-tremor, tremor),                         // Ponto 1 (Superior Esquerdo)\n      x + w + random(-tremor, tremor), y + random(-tremor, tremor),                     // Ponto 2 (Superior Direito)\n      x + w + random(-tremor, tremor), y + h + random(-tremor, tremor),                 // Ponto 3 (Inferior Direito)\n      x + random(-tremor, tremor), y + h + random(-tremor, tremor)                      // Ponto 4 (Inferior Esquerdo)\n    );\n  }\n}\n\n/*\n  FUNÇÃO: desenharCelularRetro()\n  Desenha o celular \"tijolão\" usando apenas quad(), posicionando-o \n  no canto inferior direito da nossa tela.\n*/\nfunction desenharCelularRetro() {\n  // Posições iniciais (base) do celular para facilitar a conta\n  let baseX = 640;\n  let baseY = 500;\n  \n  // --- CORPO DO CELULAR ---\n  fill(\"#111111\");     // Corpo preto de plástico\n  stroke(\"#ff00ff\");   // Borda magenta estilosa para combinar com o fundo\n  strokeWeight(3);\n  \n  // Um retângulo convencional usando quad (ângulos retos)\n  quad(\n    baseX, baseY,               // Topo-esquerda\n    baseX + 120, baseY,         // Topo-direita\n    baseX + 120, baseY + 260,   // Embaixo-direita\n    baseX, baseY + 260          // Embaixo-esquerda\n  );\n\n  // --- TELA DO CELULAR ---\n  fill(\"#003300\");     // Cor verde escura clássica das telas de LCD\n  stroke(\"#00ff66\");   // Borda iluminada verde-neon\n  strokeWeight(2);\n\n  quad(\n    baseX + 15, baseY + 20,     // Topo-esquerda da tela\n    baseX + 105, baseY + 20,    // Topo-direita da tela\n    baseX + 105, baseY + 100,   // Embaixo-direita da tela\n    baseX + 15, baseY + 100     // Embaixo-esquerda da tela\n  );\n\n  // --- BOTÕES DO CELULAR (12 botões num teclado 3x4) ---\n  fill(\"#333333\");     // Cor de preenchimento dos botões\n  stroke(\"#00ffff\");   // Borda ciano neon para dar leitura no escuro\n  strokeWeight(1.5);\n  \n  // Laço das Linhas (4 linhas no celular)\n  for (let linha = 0; linha &lt; 4; linha++) {\n    // Laço das Colunas (3 colunas no celular)\n    for (let coluna = 0; coluna &lt; 3; coluna++) {\n      \n      // Calculamos a posição de cada botão com base na linha e na coluna atuais\n      let botaoX = baseX + 22 + (coluna * 30);\n      let botaoY = baseY + 130 + (linha * 25);\n      \n      let larguraBotao = 20;\n      let alturaBotao = 12;\n      \n      // Desenha o botãozinho atual, formando um retângulo estrito usando quad()\n      quad(\n        botaoX, botaoY,                               // Sup-Esq\n        botaoX + larguraBotao, botaoY,                // Sup-Dir\n        botaoX + larguraBotao, botaoY + alturaBotao,  // Inf-Dir\n        botaoX, botaoY + alturaBotao                  // Inf-Esq\n      );\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>4º prompt:\u003c/p>\n\u003cpre>\u003ccode>Ficou quase bom! Percebi que o canto superior esquerdo ficou com um buraco. Mude o celular de posição e coloque ele no canto superior esquerdo.\u003c/code>\u003c/pre>\n\u003cp>4º código gerado:\u003c/p>\n\u003cpre>\u003ccode>/*\n  CENÁRIO CYBERPUNK COM CELULAR RETRÔ (Celular no Canto Superior Esquerdo)\n  ----------------------------------------------------------------------\n\n  Este programa cria uma arte abstrata inspirada no gênero \"Cyberpunk\",\n  caracterizado por cenários noturnos, distópicos e com muitas luzes neon.\n\n  Nesta versão, os quadrados do fundo se espalham por toda a tela, inclusive \n  ultrapassando as bordas (sangria). O celular retrô foi movido para o canto \n  superior esquerdo para preencher aquela área e equilibrar a composição.\n\n  REGRA PRINCIPAL: A única função geométrica permitida para desenhar \n  as formas é o quad() - um polígono de quatro lados. \n\n  Para iniciantes em programação:\n  - Variáveis (let): Guardam valores que podemos usar várias vezes.\n  - Arrays ([]): Guardam listas de valores, como nossa paleta de cores.\n  - Laço de repetição (for): Executa um bloco de código repetidas vezes,\n    poupando a necessidade de escrever dezenas de linhas de código.\n  - quad(x1,y1, x2,y2, x3,y3, x4,y4): Cada par de (x,y) representa a \n    posição de uma \"ponta\" do quadrilátero na nossa tela.\n*/\n\nfunction setup() {\n  // createCanvas define o tamanho do nosso quadro (largura, altura).\n  createCanvas(800, 800);\n  \n  // noLoop avisa o p5.js que este é um desenho estático, \n  // ou seja, não precisa ser atualizado continuamente.\n  noLoop();\n  \n  // randomSeed congela a aleatoriedade. O número \"2077\" garante que\n  // toda vez que você der play, o desenho gerado será exatamente o mesmo.\n  randomSeed(2077);\n  \n  // background pinta o fundo do quadro com um azul escuro/cinza.\n  background(\"#0a0b14\");\n\n  // 1. DESENHANDO O FUNDO CYBERPUNK (Prédios e luzes abstratas)\n  desenharFundoNeon();\n\n  // 2. DESENHANDO O CELULAR RETRÔ (Agora no canto superior esquerdo)\n  desenharCelularRetro();\n}\n\n/*\n  FUNÇÃO: desenharFundoNeon()\n  Cria uma série de quadriláteros espalhados pela tela.\n  Os limites de posição foram expandidos para além das bordas (valores negativos \n  e maiores que width/height) para garantir que as laterais também sejam preenchidas.\n*/\nfunction desenharFundoNeon() {\n  // Paleta de cores neon para as luzes da cidade\n  let coresNeon = [\n    \"#ff00ff\", // Magenta\n    \"#00ffff\", // Ciano\n    \"#ffff00\", // Amarelo\n    \"#00ff66\", // Verde Neon\n    \"#222233\"  // Cinza escuro (para contraste e profundidade)\n  ];\n\n  // Mantemos a quantidade (45) para preencher a área\n  for (let i = 0; i &lt; 45; i++) {\n    // Expandimos a área de sorteio para -50 até width+50 / height+50\n    // Isso faz com que os quadrados se espalhem por toda a extensão do canvas\n    let x = random(-50, width + 50);\n    let y = random(-50, height + 50);\n    \n    // Sorteamos a largura e a altura desse bloco\n    let w = random(40, 160);\n    let h = random(40, 160);\n    \n    // Em vez de uma grande deformação estrutural, usamos um \"tremor\" leve.\n    // Cada vértice do quadrado vai sair do lugar no máximo 10 pixels.\n    let tremor = 10;\n\n    // Sorteamos uma cor da nossa paleta\n    let corEscolhida = random(coresNeon);\n    fill(corEscolhida);\n    \n    // Dependendo da cor, ajustamos o contorno\n    if (corEscolhida === \"#222233\") {\n      stroke(\"#000000\"); // Bordas escuras para os blocos escuros\n      strokeWeight(2);\n    } else {\n      stroke(255); // Bordas brancas brilhantes para o neon\n      strokeWeight(1.5);\n    }\n\n    // Desenhamos o quadrilátero adicionando o leve \"tremor\" em cada ponto\n    quad(\n      x + random(-tremor, tremor), y + random(-tremor, tremor),                         // Ponto 1 (Superior Esquerdo)\n      x + w + random(-tremor, tremor), y + random(-tremor, tremor),                     // Ponto 2 (Superior Direito)\n      x + w + random(-tremor, tremor), y + h + random(-tremor, tremor),                 // Ponto 3 (Inferior Direito)\n      x + random(-tremor, tremor), y + h + random(-tremor, tremor)                      // Ponto 4 (Inferior Esquerdo)\n    );\n  }\n}\n\n/*\n  FUNÇÃO: desenharCelularRetro()\n  Desenha o celular \"tijolão\" usando apenas quad(), posicionando-o \n  no canto superior esquerdo da nossa tela.\n*/\nfunction desenharCelularRetro() {\n  // Posições iniciais (base) do celular alteradas para o canto superior esquerdo.\n  // Deixamos uma pequena margem de 20 pixels da borda.\n  let baseX = 20;\n  let baseY = 20;\n  \n  // --- CORPO DO CELULAR ---\n  fill(\"#111111\");     // Corpo preto de plástico\n  stroke(\"#ff00ff\");   // Borda magenta estilosa para combinar com o fundo\n  strokeWeight(3);\n  \n  // Um retângulo convencional usando quad (ângulos retos)\n  quad(\n    baseX, baseY,               // Topo-esquerda\n    baseX + 120, baseY,         // Topo-direita\n    baseX + 120, baseY + 260,   // Embaixo-direita\n    baseX, baseY + 260          // Embaixo-esquerda\n  );\n\n  // --- TELA DO CELULAR ---\n  fill(\"#003300\");     // Cor verde escura clássica das telas de LCD\n  stroke(\"#00ff66\");   // Borda iluminada verde-neon\n  strokeWeight(2);\n\n  quad(\n    baseX + 15, baseY + 20,     // Topo-esquerda da tela\n    baseX + 105, baseY + 20,    // Topo-direita da tela\n    baseX + 105, baseY + 100,   // Embaixo-direita da tela\n    baseX + 15, baseY + 100     // Embaixo-esquerda da tela\n  );\n\n  // --- BOTÕES DO CELULAR (12 botões num teclado 3x4) ---\n  fill(\"#333333\");     // Cor de preenchimento dos botões\n  stroke(\"#00ffff\");   // Borda ciano neon para dar leitura no escuro\n  strokeWeight(1.5);\n  \n  // Laço das Linhas (4 linhas no celular)\n  for (let linha = 0; linha &lt; 4; linha++) {\n    // Laço das Colunas (3 colunas no celular)\n    for (let coluna = 0; coluna &lt; 3; coluna++) {\n      \n      // Calculamos a posição de cada botão com base na linha e na coluna atuais\n      let botaoX = baseX + 22 + (coluna * 30);\n      let botaoY = baseY + 130 + (linha * 25);\n      \n      let larguraBotao = 20;\n      let alturaBotao = 12;\n      \n      // Desenha o botãozinho atual, formando um retângulo estrito usando quad()\n      quad(\n        botaoX, botaoY,                               // Sup-Esq\n        botaoX + larguraBotao, botaoY,                // Sup-Dir\n        botaoX + larguraBotao, botaoY + alturaBotao,  // Inf-Dir\n        botaoX, botaoY + alturaBotao                  // Inf-Esq\n      );\n    }\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>5º prompt:\u003c/p>\n\u003cpre>\u003ccode>Acho que a ideia do celular antigo não ficou boa. Consegue transformar ele em um celular moderno, simulando uma tela inicial com ícones de aplicativos ou algum deles aberto? Pode manter a posição do celular.\u003c/code>\u003c/pre>\n\u003cp>5º código gerado:\u003c/p>\n\u003cpre>\u003ccode>/*\n  CENÁRIO CYBERPUNK COM CELULAR MODERNO (Canto Superior Esquerdo)\n  ----------------------------------------------------------------------\n\n  Este programa cria uma arte abstrata inspirada no gênero \"Cyberpunk\",\n  caracterizado por cenários noturnos, distópicos e com muitas luzes neon.\n\n  Nesta versão, os quadrados do fundo se espalham por toda a tela, inclusive \n  ultrapassando as bordas (sangria). O antigo celular retrô foi substituído por \n  um smartphone moderno no canto superior esquerdo, simulando uma tela \n  inicial com ícones de aplicativos e uma \"dock\" inferior.\n\n  REGRA PRINCIPAL: A única função geométrica permitida para desenhar \n  as formas é o quad() - um polígono de quatro lados. \n\n  Para iniciantes em programação:\n  - Variáveis (let): Guardam valores que podemos usar várias vezes.\n  - Arrays ([]): Guardam listas de valores, como nossa paleta de cores.\n  - Laço de repetição (for): Executa um bloco de código repetidas vezes,\n    poupando a necessidade de escrever dezenas de linhas de código.\n  - quad(x1,y1, x2,y2, x3,y3, x4,y4): Cada par de (x,y) representa a \n    posição de uma \"ponta\" do quadrilátero na nossa tela.\n*/\n\nfunction setup() {\n  // createCanvas define o tamanho do nosso quadro (largura, altura).\n  createCanvas(800, 800);\n  \n  // noLoop avisa o p5.js que este é um desenho estático, \n  // ou seja, não precisa ser atualizado continuamente.\n  noLoop();\n  \n  // randomSeed congela a aleatoriedade. O número \"2077\" garante que\n  // toda vez que você der play, o desenho gerado será exatamente o mesmo.\n  randomSeed(2077);\n  \n  // background pinta o fundo do quadro com um azul escuro/cinza.\n  background(\"#0a0b14\");\n\n  // 1. DESENHANDO O FUNDO CYBERPUNK (Prédios e luzes abstratas)\n  desenharFundoNeon();\n\n  // 2. DESENHANDO O CELULAR MODERNO (No canto superior esquerdo)\n  desenharCelularModerno();\n}\n\n/*\n  FUNÇÃO: desenharFundoNeon()\n  Cria uma série de quadriláteros espalhados pela tela.\n  Os limites de posição foram expandidos para além das bordas (valores negativos \n  e maiores que width/height) para garantir que as laterais também sejam preenchidas.\n*/\nfunction desenharFundoNeon() {\n  // Paleta de cores neon para as luzes da cidade\n  let coresNeon = [\n    \"#ff00ff\", // Magenta\n    \"#00ffff\", // Ciano\n    \"#ffff00\", // Amarelo\n    \"#00ff66\", // Verde Neon\n    \"#222233\"  // Cinza escuro (para contraste e profundidade)\n  ];\n\n  // Mantemos a quantidade (45) para preencher a área\n  for (let i = 0; i &lt; 45; i++) {\n    // Expandimos a área de sorteio para -50 até width+50 / height+50\n    // Isso faz com que os quadrados se espalhem por toda a extensão do canvas\n    let x = random(-50, width + 50);\n    let y = random(-50, height + 50);\n    \n    // Sorteamos a largura e a altura desse bloco\n    let w = random(40, 160);\n    let h = random(40, 160);\n    \n    // Em vez de uma grande deformação estrutural, usamos um \"tremor\" leve.\n    // Cada vértice do quadrado vai sair do lugar no máximo 10 pixels.\n    let tremor = 10;\n\n    // Sorteamos uma cor da nossa paleta\n    let corEscolhida = random(coresNeon);\n    fill(corEscolhida);\n    \n    // Dependendo da cor, ajustamos o contorno\n    if (corEscolhida === \"#222233\") {\n      stroke(\"#000000\"); // Bordas escuras para os blocos escuros\n      strokeWeight(2);\n    } else {\n      stroke(255); // Bordas brancas brilhantes para o neon\n      strokeWeight(1.5);\n    }\n\n    // Desenhamos o quadrilátero adicionando o leve \"tremor\" em cada ponto\n    quad(\n      x + random(-tremor, tremor), y + random(-tremor, tremor),                         // Ponto 1 (Superior Esquerdo)\n      x + w + random(-tremor, tremor), y + random(-tremor, tremor),                     // Ponto 2 (Superior Direito)\n      x + w + random(-tremor, tremor), y + h + random(-tremor, tremor),                 // Ponto 3 (Inferior Direito)\n      x + random(-tremor, tremor), y + h + random(-tremor, tremor)                      // Ponto 4 (Inferior Esquerdo)\n    );\n  }\n}\n\n/*\n  FUNÇÃO: desenharCelularModerno()\n  Desenha um smartphone simulando uma tela inicial de aplicativos\n  usando apenas a função quad(), no canto superior esquerdo da tela.\n*/\nfunction desenharCelularModerno() {\n  // Margem de 20 pixels da borda (mantendo a posição).\n  let baseX = 20;\n  let baseY = 20;\n  \n  // --- CORPO DO SMARTPHONE ---\n  // Celulares modernos são mais finos e altos, quase sem bordas (bezels)\n  fill(\"#111111\");     // Corpo escuro\n  stroke(\"#00ffff\");   // Borda ciano para destacar na arte\n  strokeWeight(3);\n  \n  quad(\n    baseX, baseY,               // Topo-esquerda\n    baseX + 140, baseY,         // Topo-direita\n    baseX + 140, baseY + 280,   // Embaixo-direita\n    baseX, baseY + 280          // Embaixo-esquerda\n  );\n\n  // --- TELA DO SMARTPHONE ---\n  fill(\"#1a1c29\");     // Fundo da tela imitando um \"dark mode\"\n  stroke(\"#ff00ff\");   // Borda interna magenta\n  strokeWeight(1.5);\n\n  quad(\n    baseX + 5, baseY + 5,       // Topo-esquerda da tela\n    baseX + 135, baseY + 5,     // Topo-direita da tela\n    baseX + 135, baseY + 275,   // Embaixo-direita da tela\n    baseX + 5, baseY + 275      // Embaixo-esquerda da tela\n  );\n\n  // --- NOTCH / CÂMERA FRONTAL ---\n  // O detalhe preto no topo da tela do celular\n  fill(\"#000000\");\n  stroke(\"#000000\");\n  \n  quad(\n    baseX + 40, baseY + 5,\n    baseX + 100, baseY + 5,\n    baseX + 100, baseY + 20,\n    baseX + 40, baseY + 20\n  );\n\n  // --- ÍCONES DE APLICATIVOS (Tela Inicial) ---\n  // Vamos desenhar uma grade de 4 linhas e 3 colunas para os apps\n  let appSize = 25;\n  let espacoX = 15;\n  let espacoY = 20;\n  \n  // Ponto de partida para o primeiro aplicativo\n  let inicioX = baseX + 18;\n  let inicioY = baseY + 45;\n\n  let coresApps = [\"#ff00ff\", \"#00ffff\", \"#ffff00\", \"#00ff66\"];\n  strokeWeight(1.5);\n\n  for (let linha = 0; linha &lt; 4; linha++) {\n    for (let coluna = 0; coluna &lt; 3; coluna++) {\n      \n      let appX = inicioX + (coluna * (appSize + espacoX));\n      let appY = inicioY + (linha * (appSize + espacoY));\n      \n      // Escolhemos as cores de forma alternada para os ícones\n      let corIndex = (linha + coluna) % 4;\n      fill(coresApps[corIndex]);\n      stroke(\"#ffffff\"); // Contorno branco nos apps\n      \n      quad(\n        appX, appY,\n        appX + appSize, appY,\n        appX + appSize, appY + appSize,\n        appX, appY + appSize\n      );\n    }\n  }\n\n  // --- DOCK INFERIOR ---\n  // Aquela barrinha no rodapé do celular onde ficam os apps principais\n  fill(\"#2b2d42\");\n  stroke(\"#222233\");\n  quad(\n    baseX + 10, baseY + 215,\n    baseX + 130, baseY + 215,\n    baseX + 130, baseY + 265,\n    baseX + 10, baseY + 265\n  );\n\n  // Desenhando 3 aplicativos na Dock\n  for (let i = 0; i &lt; 3; i++) {\n    let appX = inicioX + (i * (appSize + espacoX));\n    let appY = baseY + 228;\n    \n    // Usamos cores em ordem diferente\n    fill(coresApps[(i + 2) % 4]);\n    stroke(\"#ffffff\");\n    \n    quad(\n      appX, appY,\n      appX + appSize, appY,\n      appX + appSize, appY + appSize,\n      appX, appY + appSize\n    );\n  }\n}\u003c/code>\u003c/pre>\n\u003cp>Por fim, na função desenharCelularModerno(), mudei os seguintes parâmetros: \u003c/p>\n\u003cp>let baseX = 50;\u003cbr>let baseY = 70;\u003c/p>\n\u003cp>Curiosidade: a seed que o Gemini escolheu foi 2077, por causa do jogo Cyberpunk 2077. Como a ideia do prompt era criar uma estética baseada no gênero cyberpunk (com luzes de neon vibrantes, contrastes e fundos escuros), a IA achou que seria um easter egg divertido usar esse valor como seed da aleatoriedade.\u003c/p>\n\u003cp>Por fim, a arte foi finalizada.\u003c/p>","excerpt":"Um sketch feito pelo Gemini usando apenas quads, contendo algumas adições pessoais. Autor: Gabriel Rodrigues da Silva DRE: 121044858 Para a construção desse…"},{"folder":"MariaEduardaAraujo Artefato 1","title":"MariaEduardaAraujo Artefato 1","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch1>Artefato da Semana 1: Introdutório\u003c/h1>\n\u003cp>\u003cstrong>Autora:\u003c/strong> Maria Eduarda Araújo  \u003cbr>\u003cstrong>DRE:\u003c/strong> 119054059  \u003c/p>\n\u003ch2>Sobre o Projeto\u003c/h2>\n\u003cp>Decidi usar a ferramenta que foi recomendada e que estava sendo usada no vídeo porque achei bem simples de usar. Montei o \u003ccode>.zip\u003c/code> exatamente com os mesmos nomes dos arquivos que estavam no exemplo que o professor deu. \u003c/p>\n\u003ch2>Processo de Criação\u003c/h2>\n\u003cp>A principio, vi o que o Gemini me recomendava e rodei, mas o resultado ficou meio sem graça. Então, decidi começar a fazer especificações: fiz outro prompt para ele criar vários \u003ccode>quad\u003c/code>s em formato de coração e para variar a cor entre rosa e vermelho, porque achei que ficaria legal. Testei mais de um prompt até chegar em um que me deu o coração que eu queria e para cada prompt que testei abri um chat diferente. \u003c/p>\n\u003cp>O prompt que me deu o coração que eu gostei foi o que está abaixo. Eu baseei meu prompt no exemplo do professor, então também pedi para ele colocar a explicação e a documentação. Quando eu coloquei o código que a IA me deu no editor, o coração já ficou exatamente como eu estava imaginando, então nem pedi para fazer alterações.\u003c/p>\n\u003ch2>Meu prompt utilizado no Gemini: \u003c/h2>\n\u003cblockquote>\"Crie um sketch estático em p5.js. Apresente o resultado sob a forma de um único script em javascript.\u003c/blockquote>\n\u003cblockquote>\u003c/blockquote>\n\u003cblockquote>\u003cstrong>Ideia visual:\u003c/strong> Crie o desenho de um coração em estilo mosaico, composto por vários pequenos quadrados dispostos em uma grade. A paleta de cores deve ser linda e variada, alternando entre diferentes tons de vermelho (carmesim, rubi, vinho) e rosa (magenta, rosa choque, tons pastéis), com um fundo escuro contrastante e uma moldura ao redor.\u003c/blockquote>\n\u003cblockquote>\u003c/blockquote>\n\u003cblockquote>\u003cstrong>Regra de desenho:\u003c/strong> O sketch deve usar como primitiva de desenho apenas o comando \u003ccode>quad\u003c/code>. É permitido usar comandos de estilização como \u003ccode>stroke\u003c/code>, \u003ccode>fill\u003c/code>, \u003ccode>strokeWeight\u003c/code>, etc.\u003c/blockquote>\n\u003cblockquote>\u003c/blockquote>\n\u003cblockquote>O programa fonte deve ser bem documentado e comentado para ser explicado para uma plateia de iniciantes em programação de computadores.\"\u003c/blockquote>","excerpt":"Artefato da Semana 1: Introdutório Autora: Maria Eduarda Araújo DRE: 119054059 Sobre o Projeto Decidi usar a ferramenta que foi recomendada e que estava sendo…"},{"folder":"artefato1 joao galetti","title":"artefato1 joao galetti","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>João Galetti Carvalho - DRE: 122034351\u003c/p>\n\u003cp>Trabalho 100% sem IA\u003c/p>\n\u003cp>Grid de quadrados que se comprimem e descomprimem verticalmente no tempo, alternando estado pelas linhas.\u003c/p>\n\u003cp>Parâmetros variáveis através de constantes declaradas no começo do programa:\u003c/p>\n\u003cp>Tamanho do quadrado: SQUARE_SIZE\u003cbr>Número de linhas: N_ROWS\u003cbr>Número de Colunas: N_COLUMNS\u003cbr>Tamanho da borda horizontal: WIDTH_BORDER\u003cbr>Tamanho da borda vertical: HEIGHT_BORDER\u003c/p>\n\u003cp>Várias outras ideias vieram para continuar incrementando o desenho e suas interações como interação com o mouse, outros movimentos, adição de aleatoriedade e velocidade variável via parâmetro\u003c/p>","excerpt":"João Galetti Carvalho DRE: 122034351 Trabalho 100% sem IA Grid de quadrados que se comprimem e descomprimem verticalmente no tempo, alternando estado pelas…"},{"folder":"helena giovanna artefato 1 introdutrio","title":"Cidade futurista durante a noite - usando quads","tags":["quads","ai","chatgpt"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo ChatGPT usando apenas quads.\u003c/p>\n\u003cp>Autora: Helena Giovanna\u003c/p>\n\u003cp>Prompt usado: \"Crie um sketch estático, sem animação, em p5.js, apresentando o resultado como um único script JavaScript que possa ser colado e executado diretamente no editor.p5js.org.\u003c/p>\n\u003cp>O tema visual do sketch será uma cidade futurista durante a noite, vista de frente, com diferentes prédios, janelas iluminadas, ruas e reflexos.\u003c/p>\n\u003cp>Regras obrigatórias\u003c/p>\n\u003cul>\n\u003cli>Utilize como única primitiva geométrica de desenho o comando \u003ccode>quad()\u003c/code> do p5.js.\u003c/li>\n\u003cli>Não utilize \u003ccode>rect()\u003c/code>, \u003ccode>ellipse()\u003c/code>, \u003ccode>circle()\u003c/code>, \u003ccode>triangle()\u003c/code>, \u003ccode>line()\u003c/code>, \u003ccode>arc()\u003c/code> ou outras primitivas geométricas.\u003c/li>\n\u003cli>É permitido utilizar comandos de estilização, como \u003ccode>fill()\u003c/code>, \u003ccode>stroke()\u003c/code>, \u003ccode>noStroke()\u003c/code>, \u003ccode>strokeWeight()\u003c/code>, entre outros.\u003c/li>\n\u003cli>O sketch deve ser completamente estático, portanto não deve possuir animações ou elementos que mudem com o tempo.\u003c/li>\n\u003cli>Utilize um canvas de 800 × 600 pixels.\u003c/li>\n\u003c/ul>\n\u003cp>Composição visual\u003c/p>\n\u003cp>Construa a imagem utilizando diferentes quadriláteros:\u003c/p>\n\u003cul>\n\u003cli>O fundo deve representar um céu noturno.\u003c/li>\n\u003cli>Crie vários prédios com alturas e larguras diferentes.\u003c/li>\n\u003cli>Alguns prédios podem apresentar pequenas inclinações ou perspectivas, aproveitando os quatro pontos independentes do \u003ccode>quad()\u003c/code>.\u003c/li>\n\u003cli>As janelas devem ser pequenos quadriláteros organizados em padrões, com algumas iluminadas e outras apagadas.\u003c/li>\n\u003cli>Na parte inferior da imagem, crie uma rua ou superfície que apresente sensação de perspectiva.\u003c/li>\n\u003cli>Utilize quadriláteros alongados para criar reflexos das luzes dos prédios sobre a rua.\u003c/li>\n\u003cli>Acrescente alguns elementos abstratos no céu construídos também exclusivamente com \u003ccode>quad()\u003c/code>.\u003c/li>\n\u003cli>Procure criar sensação de profundidade utilizando sobreposição, diferenças de tamanho e variações de tonalidade.\u003c/li>\n\u003c/ul>\n\u003cp>Organização do código\u003c/p>\n\u003cp>O código deve ser simples e adequado para estudantes iniciantes em programação.\u003c/p>\n\u003cp>Comente o programa em português explicando:\u003c/p>\n\u003col>\n\u003cli>a criação do canvas;\u003c/li>\n\u003cli>a definição das cores;\u003c/li>\n\u003cli>como funciona o comando \u003ccode>quad()\u003c/code>;\u003c/li>\n\u003cli>quais grupos de quadriláteros formam cada elemento da imagem;\u003c/li>\n\u003cli>como as coordenadas dos quatro vértices determinam o formato de cada quadrilátero.\u003c/li>\n\u003c/ol>\n\u003cp>Evite estruturas excessivamente complexas. Dê preferência a código claro e fácil de modificar posteriormente.\u003c/p>\n\u003cp>Ao final, entregue somente o código JavaScript completo, pronto para ser copiado para o editor do p5.js.\"\u003c/p>","excerpt":"Um sketch feito pelo ChatGPT usando apenas quads. Autora: Helena Giovanna Prompt usado: \"Crie um sketch estático, sem animação, em p5.js, apresentando o…"},{"folder":"Artefato 1 Gabriella Murta","title":"Composição com quadros","tags":["quads","ia","generative"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo GPT usando somente quads.\u003c/p>\n\u003cp>Autor: Gabriella Murta\u003c/p>\n\u003cp>Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. Use aleatoriedade mas deve seguir as regras dos trabalhos artísticos de Wassily Kandinsky.\u003c/p>","excerpt":"Um sketch feito pelo GPT usando somente quads. Autor: Gabriella Murta Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob…"},{"folder":"mellow garden","title":"Composição com quads","tags":["quads","ai","chatgpt","generative"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo ChatGPT usando apenas quads.\u003c/p>\n\u003cp>Autor: Claudio Esperança\u003c/p>\n\u003cp>Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. Use aleatoriedade mas de forma que a seguir regras de composição usadas em desenho artístico.\u003c/p>","excerpt":"Um sketch feito pelo ChatGPT usando apenas quads. Autor: Claudio Esperança Prompt usado: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado…"},{"folder":"2026 08 14 Carolina Abdu","title":"Sketch de um Girassol usando `quad()`","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>\u003cstrong>Autor:\u003c/strong> Carolina Abdu\u003c/p>\n\u003cp>\u003cstrong>Prompt usado no ChatGPT:\u003c/strong>\u003cbr>Crie um sketch estático em p5.js de um girassol. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. \u003c/p>\n\u003cp>Depois precisei enviar outro prompt pois ele usou funções como seno e cosseno, então para manter a simplicidade do trabalho, investiguei e pedi para ele adptar.\u003c/p>","excerpt":"Autor: Carolina Abdu Prompt usado no ChatGPT: Crie um sketch estático em p5.js de um girassol. Apresente o resultado sob a forma de um único script em…"},{"folder":"Artefato1ArturTaboada","title":"Artefato1ArturTaboada","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch1>Composição Geométrica com Quadriláteros\u003c/h1>\n\u003cp>Este sketch cria uma composição abstrata utilizando apenas a primitiva \u003ccode>quad()\u003c/code> do p5.js. O objetivo foi explorar princípios de composição artística, como repetição, variação, hierarquia e contraste, mantendo um estilo geométrico minimalista e organizado.\u003c/p>\n\u003ch2>Como o sketch funciona\u003c/h2>\n\u003cul>\n\u003cli>O código percorre uma estrutura lógica para desenhar formas, variando sua posição e tamanho.\u003c/li>\n\u003cli>Utiliza-se uma paleta de cores definida para garantir a harmonia visual.\u003c/li>\n\u003cli>A função \u003ccode>linhaquad()\u003c/code> automatiza o preenchimento de cada \"linha\" de elementos com uma cor diferente da paleta.\u003c/li>\n\u003cli>Não se utiliza bordas (\u003ccode>noStroke()\u003c/code>) para obter um visual mais limpo.\u003c/li>\n\u003c/ul>\n\u003ch2>Autor\u003c/h2>\n\u003cp>Artur Taboada Dios Carvalho\u003c/p>\n\u003ch2>Como visualizar este projeto\u003c/h2>\n\u003cp>\u003cstrong>Usando o ambiente online (p5front)\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Acesse o ambiente de desenvolvimento utilizado na disciplina: \u003ca href=\"https://esperanc.github.io/p5front/\" target=\"_blank\" rel=\"noopener\">https://esperanc.github.io/p5front/\u003c/a>.\u003c/li>\n\u003cli>Copie todo o conteúdo do arquivo \u003ccode>sketch.js\u003c/code> deste zip e cole na área de edição de código do site.\u003c/li>\n\u003cli>O resultado será renderizado na tela de visualização após o botão \"Run\" ser clicado.\u003c/li>\n\u003c/ol>","excerpt":"Composição Geométrica com Quadriláteros Este sketch cria uma composição abstrata utilizando apenas a primitiva quad() do p5.js. O objetivo foi explorar…"},{"folder":"artefato 01 quadrilateros","title":"artefato 01 quadrilateros","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch1>Marcha Digital — Desenho com Quadriláteros\u003c/h1>\n\u003cp>\u003cstrong>Autor:\u003c/strong> Victor Hugo Figueiredo Pereira da Silva\u003c/p>\n\u003cp>\u003cstrong>Artefato da semana 01\u003c/strong> — tema: \u003cem>desenho com quadriláteros\u003c/em> (primitiva \u003ccode>quad\u003c/code> do p5.js)\u003c/p>\n\u003cp>!\u003ca href=\"thumbnail.png\" target=\"_blank\" rel=\"noopener\">thumbnail\u003c/a>\u003c/p>\n\u003ch2>Ideia do trabalho\u003c/h2>\n\u003cp>O sketch é uma releitura semiabstrata da famosa ilustração **\"A Marcha do\u003cbr>Progresso\"** (aquela sequência em que uma figura vai, passo a passo, se\u003cbr>tornando mais ereta e mais alta). Aqui a marcha vai da \u003cstrong>Idade da Pedra\u003c/strong>\u003cbr>até a \u003cstrong>fusão do ser humano com a Inteligência Artificial\u003c/strong>, mostrando a\u003cbr>evolução das ferramentas e da tecnologia que o ser humano usa.\u003c/p>\n\u003cp>Da esquerda para a direita, as 5 estações da marcha são:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Hominídeo agachado com um osso\u003c/strong> — a primeira ferramenta da história (Idade da Pedra).\u003c/li>\n\u003cli>\u003cstrong>Homo erectus com uma lança\u003c/strong> — ferramenta composta e postura ereta.\u003c/li>\n\u003cli>\u003cstrong>Trabalhador da Revolução Industrial\u003c/strong> — máquina a engrenagem, alavanca e chaminé.\u003c/li>\n\u003cli>\u003cstrong>Pessoa em frente ao computador\u003c/strong> — a era digital pessoal.\u003c/li>\n\u003cli>\u003cstrong>Fusão humano + Inteligência Artificial\u003c/strong> — corpo com gradiente \"digital\" e um halo de rede neural (nós conectados por cabos) pairando sobre a cabeça.\u003c/li>\n\u003c/ol>\n\u003cp>Dois recursos visuais reforçam a ideia de evolução, como na imagem original:\u003cbr>a postura das figuras fica cada vez mais ereta e a altura aumenta a cada\u003cbr>estação; e o céu passa de um amanhecer quente e terreno (à esquerda, Idade\u003cbr>da Pedra) para uma \"noite digital\" neon, com estrelas que viram pontinhos\u003cbr>de dado (à direita, era da IA).\u003c/p>\n\u003ch2>Prompt utilizado\u003c/h2>\n\u003cp>Segui o modelo de prompt sugerido no enunciado, adaptado para descrever a\u003cbr>ideia acima:\u003c/p>\n\u003cblockquote>Crie um sketch estático (sem animação) em p5.js, em um único script\u003c/blockquote>\n\u003cblockquote>JavaScript pronto para colar no editor.p5js.org. Use apenas a primitiva\u003c/blockquote>\n\u003cblockquote>\u003ccode>quad\u003c/code> para desenhar (estilização com \u003ccode>stroke\u003c/code>, \u003ccode>fill\u003c/code>, \u003ccode>strokeWeight\u003c/code>\u003c/blockquote>\n\u003cblockquote>etc. é permitida). Tema: uma arte semiabstrata inspirada na icônica\u003c/blockquote>\n\u003cblockquote>imagem \"A Marcha do Progresso\", mostrando a evolução das ferramentas e\u003c/blockquote>\n\u003cblockquote>da tecnologia usadas pelo ser humano — da Idade da Pedra até uma figura\u003c/blockquote>\n\u003cblockquote>fundida com inteligência artificial — em estilo low-poly, com paleta de\u003c/blockquote>\n\u003cblockquote>cores evoluindo de tons terrosos para tons digitais neon. Comente o\u003c/blockquote>\n\u003cblockquote>código para iniciantes em programação.\u003c/blockquote>\n\u003ch2>Regra técnica (só \u003ccode>quad\u003c/code>)\u003c/h2>\n\u003cp>A única primitiva de desenho usada em todo o sketch é \u003ccode>quad()\u003c/code>. Não há\u003cbr>\u003ccode>ellipse\u003c/code>, \u003ccode>rect\u003c/code>, \u003ccode>line\u003c/code> ou \u003ccode>triangle\u003c/code> em nenhum lugar do código — inclusive\u003cbr>os \"círculos\" (cabeças, engrenagem, sol, halo de dados) e os \"retângulos\"\u003cbr>(monitor, mesa, chão) são construídos combinando vários quadriláteros\u003cbr>pequenos:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>quadRect(x, y, w, h)\u003c/code> — um retângulo é só um quadrilátero com 4 ângulos retos.\u003c/li>\n\u003cli>\u003ccode>quadLimb(x1, y1, x2, y2, w1, w2)\u003c/code> — desenha um \"membro\" afunilado entre\u003c/li>\n\u003cp>  dois pontos (braço, perna, lança, cabo, alavanca...). Quando a largura\u003cbr>  numa das pontas é \u003ccode>0\u003c/code>, o quadrilátero degenera numa ponta bem fina — é\u003cbr>  assim que a ponta de lança e os \"cabos\" da rede neural são desenhados.\u003c/p>\n\u003cli>\u003ccode>quadDisc(cx, cy, r, segments, corA, corB)\u003c/code> — aproxima um círculo\u003c/li>\n\u003cp>  fatiando-o em vários quadriláteros bem finos (como pedaços de pizza),\u003cbr>  usado nas cabeças, na engrenagem, no sol e no halo de IA.\u003c/p>\n\u003c/ul>\n\u003cp>O sketch é \u003cstrong>estático\u003c/strong>: todo o desenho acontece uma única vez dentro de\u003cbr>\u003ccode>setup()\u003c/code>, e \u003ccode>noLoop()\u003c/code> garante que nada seja redesenhado depois — por isso\u003cbr>não existe função \u003ccode>draw()\u003c/code> no arquivo.\u003c/p>\n\u003cp>O código-fonte (\u003ccode>sketch.js\u003c/code>) está comentado em português, pensado para ser\u003cbr>explicado a uma plateia iniciante em programação.\u003c/p>\n\u003ch2>Como executar\u003c/h2>\n\u003col>\n\u003cli>Abra \u003ca href=\"https://editor.p5js.org\" target=\"_blank\" rel=\"noopener\">editor.p5js.org\u003c/a>.\u003c/li>\n\u003cli>Cole o conteúdo de \u003ccode>sketch.js\u003c/code> no editor.\u003c/li>\n\u003cli>Rode o sketch (▶). A imagem é desenhada uma única vez, sem animação.\u003c/li>\n\u003c/ol>\n\u003cp>(Também é possível abrir \u003ccode>index.html\u003c/code> diretamente no navegador — ele já\u003cbr>carrega o p5.js e o \u003ccode>sketch.js\u003c/code>.)\u003c/p>\n\u003ch2>Arquivos deste pacote\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>sketch.js\u003c/code> — o script p5.js (única primitiva de desenho: \u003ccode>quad\u003c/code>).\u003c/li>\n\u003cli>\u003ccode>index.html\u003c/code> — página simples para rodar \u003ccode>sketch.js\u003c/code> fora do editor.\u003c/li>\n\u003cli>\u003ccode>thumbnail.png\u003c/code> — imagem representativa do resultado gerado pelo sketch.\u003c/li>\n\u003cli>\u003ccode>README.md\u003c/code> — este arquivo.\u003c/li>\n\u003c/ul>","excerpt":"Marcha Digital — Desenho com Quadriláteros Autor: Victor Hugo Figueiredo Pereira da Silva Artefato da semana 01 — tema: desenho com quadriláteros (primitiva…"},{"folder":"luz noceda quads (1)","title":"Luz Noceda reimaginada com quadriláteros","tags":["chatgpt","luz nocedo","the owl house","witches"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>O chatgpt é muito melhor nisso que o Gemini\u003c/p>\n\u003cp>Eu tive a ideia de reimaginar uma cena de um desenho que eu gosto, como ficaria com quadriláteros.\u003c/p>\n\u003cp>Autor: Thomas Cardoso de Miranda\u003c/p>\n\u003cp>Prompt usado:\u003c/p>\n\u003cp>Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. Gostaria que fizesse uma reinterpretação dessa imagem seguindo as diretrizes apresentadas. \u003c/p>\n\u003cp>Aqui está a imagem usada como exemplo:\u003c/p>\n\u003cp>https://i.pinimg.com/originals/bf/d3/f1/bfd3f1bc996220a087324c9deecba58e.jpg\u003c/p>","excerpt":"O chatgpt é muito melhor nisso que o Gemini Eu tive a ideia de reimaginar uma cena de um desenho que eu gosto, como ficaria com quadriláteros. Autor: Thomas…"},{"folder":"artefato 1 samuel vitor","title":"artefato 1 samuel vitor","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch1>Noite em Quadriláteros\u003c/h1>\n\u003cp>\u003cstrong>Autor:\u003c/strong> Samuel Vitor Pedro e Araujo\u003cbr>\u003cstrong>Disciplina:\u003c/strong> Programação Criativa  \u003cbr>\u003cstrong>Atividade:\u003c/strong> Artefato da semana 1 — Desenho com quadriláteros\u003c/p>\n\u003ch2>Descrição\u003c/h2>\n\u003cp>Este trabalho é um sketch estático em p5.js inspirado na atmosfera noturna, nas cores vibrantes e no movimento das pinceladas de \u003cem>A Noite Estrelada\u003c/em>, de Vincent van Gogh. A composição apresenta um céu azul profundo, estrelas amarelas, uma lua crescente luminosa, grandes espirais, montanhas, uma aldeia silenciosa e um cipreste escuro em primeiro plano.\u003c/p>\n\u003cp>A regra criativa foi usar \u003ccode>quad()\u003c/code> como a única primitiva de desenho. O próprio fundo, as casas, os telhados, as janelas, as estrelas, a lua, as montanhas, o cipreste, os brilhos e todas as texturas são formados por quadriláteros.\u003c/p>\n\u003ch2>Execução\u003c/h2>\n\u003cp>Solicitei ao ChatGPT 5.6 Luna xHigh:\u003cbr>\u003cem>me de uma ideia criativa de sketch estatico com as seguites limitações 'O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc.'\u003c/em>\u003c/p>\n\u003cp>Recebi a idéia \"A cidade refletida numa poça\" e lembrei de noite estrelada, então segui:\u003cbr>\u003cem>me de um prompt pra gerar noite estrelada, de van gogh, com as limitações da mensagem anterior\u003c/em>\u003c/p>\n\u003cp>O retorno foi:\u003c/p>\n\u003cp>\u003cem>Crie um sketch estático em p5.js inspirado na atmosfera de A Noite Estrelada, de Vincent van Gogh, com céu noturno azul profundo, estrelas amarelas intensas, uma lua luminosa, espirais no céu, uma aldeia silenciosa e um grande cipreste escuro em primeiro plano.\u003c/em>\u003cbr>\u003cem>Existe uma limitação rígida: a única primitiva de desenho permitida é quad(). Todas as formas visíveis — estrelas, lua, casas, janelas, montanhas, cipreste, espirais, brilho e textura — devem ser construídas exclusivamente com quadriláteros. Use quads finos, sobrepostos, rotacionados e deformados para criar pinceladas curvas e orgânicas.\u003c/em>  \u003cbr>\u003cem>Não use ellipse(), circle(), rect(), line(), triangle(), arc(), point(), imagens ou SVGs. Comandos de estilização como fill(), stroke(), strokeWeight(), noStroke(), transparência e transformações são permitidos. O resultado deve parecer uma pintura feita com pinceladas geométricas, mantendo a composição e as cores vibrantes associadas à obra de Van Gogh, sem animação e sem interação.\u003c/em>\u003c/p>\n\u003cp>Enviei ao ChatGPT 5.6 Sol Ultra que gerou p5.js.\u003c/p>\n\u003ch2>Ideia e processo\u003c/h2>\n\u003cp>O desenho transforma pequenos quads em \"pinceladas geométricas\". Há três técnicas principais:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Pinceladas afiladas:\u003c/strong> um quadrilátero estreito liga dois pontos, com uma largura diferente em cada extremidade.\u003c/li>\n\u003cli>\u003cstrong>Fitas curvas:\u003c/strong> uma sequência de quads encostados acompanha pontos calculados matematicamente e cria a ilusão de uma curva ou espiral.\u003c/li>\n\u003cli>\u003cstrong>Mosaicos radiais:\u003c/strong> setores quadrilaterais organizados em anéis formam os halos, as estrelas e a lua.\u003c/li>\n\u003c/ol>\n\u003cp>As formas são sobrepostas com diferentes tons de azul, amarelo, verde e transparência. Um gerador pseudoaleatório com semente fixa varia as pinceladas, mas preserva exatamente o mesmo resultado a cada execução.\u003c/p>\n\u003cp>O sketch produz \u003cstrong>6.287 quadriláteros\u003c/strong>, não contém animação nem interação e chama \u003ccode>noLoop()\u003c/code> após terminar a pintura.\u003c/p>\n\u003ch2>Arquivos\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>sketch.js\u003c/code>: script completo, comentado em português para facilitar a leitura por iniciantes;\u003c/li>\n\u003cli>\u003ccode>thumbnail.png\u003c/code>: imagem representativa do resultado final;\u003c/li>\n\u003cli>\u003ccode>README.md\u003c/code>: esta descrição.\u003c/li>\n\u003c/ul>\n\u003ch2>Como executar\u003c/h2>\n\u003ch3>p5Front\u003c/h3>\n\u003col>\n\u003cli>Abra o \u003ca href=\"https://esperanc.github.io/p5front/\" target=\"_blank\" rel=\"noopener\">p5Front\u003c/a>.\u003c/li>\n\u003cli>Crie um novo sketch.\u003c/li>\n\u003cli>Copie todo o conteúdo de \u003ccode>sketch.js\u003c/code> para o editor.\u003c/li>\n\u003cli>Execute o sketch e confira o resultado.\u003c/li>\n\u003c/ol>\n\u003ch3>Editor oficial do p5.js\u003c/h3>\n\u003col>\n\u003cli>Abra o \u003ca href=\"https://editor.p5js.org/\" target=\"_blank\" rel=\"noopener\">editor.p5js.org\u003c/a>.\u003c/li>\n\u003cli>Crie um novo sketch.\u003c/li>\n\u003cli>Substitua o conteúdo de \u003ccode>sketch.js\u003c/code> pelo código deste trabalho.\u003c/li>\n\u003cli>Clique em \u003cstrong>Play\u003c/strong>.\u003c/li>\n\u003c/ol>\n\u003ch2>Restrição técnica\u003c/h2>\n\u003cp>A única chamada que gera geometria no canvas é \u003ccode>quad()\u003c/code>, centralizada na função auxiliar \u003ccode>patch()\u003c/code>. Não são utilizadas outras primitivas, imagens, SVGs, animações ou eventos de entrada.\u003c/p>","excerpt":"Noite em Quadriláteros Autor: Samuel Vitor Pedro e Araujo Disciplina: Programação Criativa Atividade: Artefato da semana 1 — Desenho com quadriláteros…"},{"folder":"sketch estatico de genebra","title":"Sketch Estático de Genebra","tags":["quads","ai","claude"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito com Claude Ai usando apenas quads. \u003c/p>\n\u003cp>Autora: Rafaella Lenzi Romano\u003c/p>\n\u003cp>Prompt usado: Crie um sketch estático (sem animação) em p5.js que se assemelhe à paisagem do lago de Genebra com o jet d'eau e as montanhas. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. \u003c/p>\n\u003cp>Link da imagem enviada: https://share.google/E8wO1ASHej2dTpFOZ \u003c/p>\n\u003cp>Além dos prompts iniciais, foram feitas iterações para adicionar telhados aos prédios e para melhorar o aspecto da margem do lago, do arco-íris e do barco de passeio. Ajustes de escala, cor, posição e etc foram feitos manualmente.\u003c/p>","excerpt":"Um sketch feito com Claude Ai usando apenas quads. Autora: Rafaella Lenzi Romano Prompt usado: Crie um sketch estático (sem animação) em p5.js que se assemelhe…"},{"folder":"despair","title":"Despair","tags":["Generative","AI","ChatGPT","Quads","Games\u003cleague of legends","Trauma"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>replicação de uma captura de tela feita no jogo League of Legends.\u003c/p>\n\u003cp>Autor: Paulo Barbosa.\u003c/p>\n\u003cp>Prompt utilizado:\u003c/p>\n\u003cp>Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. replique uma captura de tela do jogo league of legends\u003c/p>","excerpt":"replicação de uma captura de tela feita no jogo League of Legends. Autor: Paulo Barbosa. Prompt utilizado: Crie um sketch estático (sem animação) em p5.js.…"},{"folder":"cavaloxadrez","title":"Cavalo Xadrez","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch3>Autor: Nick Correa\u003c/h3>\n\u003cp>Representação de possíveis movimentos de um cavalo num tabuleiro de xadrez. ChatGPT foi usado para o código iterativo de pintar o tabuleiro. O cavalo foi feito manualmente calculando coordenadas no figma a partir de uma imagem de exemplo também gerada por IA.\u003c/p>\n\u003ch3>Prompts usados:\u003c/h3>\n\u003cp>\"escreva um código usando a primitiva quad para p5 front para desenhar um tabuleiro de xadrez\"\u003c/p>\n\u003cp>\"quero que \u003cbr>desenhe um 'cavalo' usando apenas a primitiva quad em uma das casas do tabuleiro\u003cbr>As casas que o cavalo poderia se mover devem estar em verde\"\u003c/p>","excerpt":"Autor: Nick Correa Representação de possíveis movimentos de um cavalo num tabuleiro de xadrez. ChatGPT foi usado para o código iterativo de pintar o tabuleiro.…"},{"folder":"Artefato1 Natan Azevedo Gomes","title":"Artefato 1 - quads","tags":["quads","generative","ai","gemini"],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003cp>Um sketch feito pelo Gemini apenas com quads.\u003c/p>\n\u003cp>Autor: Natan Azevedo Gomes\u003c/p>\n\u003cp>Prompt: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a forma de um único script em javascript a ser colado num ambiente de desenvolvimento como o editor.p5js.org. O sketch deve usar como primitiva de desenho apenas o comando quad. É permitido usar comandos de estilização como stroke, fill, strokeWeight, etc. O programa fonte deve ser documentado para ser explicado para uma plateia de iniciantes em programação de computadores. Pode criar quadriláteros sobrepostos e dispersos, de tamanhos e orientações diferentes. Utilize uma paleta de cores pastel com uma saturação baixa.\u003c/p>","excerpt":"Um sketch feito pelo Gemini apenas com quads. Autor: Natan Azevedo Gomes Prompt: Crie um sketch estático (sem animação) em p5.js. Apresente o resultado sob a…"},{"folder":"artefato 1 Murilo Jorge de Figueiredo","title":"artefato 1   Murilo Jorge de Figueiredo","tags":[],"collection":"artefato da semana/1","hasThumb":true,"descHtml":"\u003ch1>Artefato 2 — Quadriláteros Aninhados\u003c/h1>\n\u003cp>\u003cstrong>Autor:\u003c/strong> Murilo Jorge de Figueiredo\u003c/p>\n\u003cp>!\u003ca href=\"thumbnail.png\" target=\"_blank\" rel=\"noopener\">thumbnail\u003c/a>\u003c/p>\n\u003ch2>Descrição\u003c/h2>\n\u003cp>Sketch estático em \u003cstrong>p5.js\u003c/strong> que usa \u003cstrong>exclusivamente a primitiva \u003ccode>quad()\u003c/code>\u003c/strong> como\u003cbr>comando de desenho. Os demais comandos são apenas de estilização (\u003ccode>fill\u003c/code>,\u003cbr>\u003ccode>stroke\u003c/code>, \u003ccode>strokeWeight\u003c/code>, \u003ccode>strokeJoin\u003c/code>, \u003ccode>background\u003c/code>) e de sorteio (\u003ccode>random\u003c/code>,\u003cbr>\u003ccode>randomSeed\u003c/code>).\u003c/p>\n\u003cp>A regra construtiva é simples e cabe em duas frases:\u003c/p>\n\u003cblockquote>Sorteamos 4 pontos aleatórios dentro de um quadrado de lado \u003cstrong>n\u003c/strong> e ligamos os\u003c/blockquote>\n\u003cblockquote>quatro com um \u003ccode>quad()\u003c/code>. Em seguida o quadrado \u003cstrong>encolhe\u003c/strong> (\u003ccode>n\u003c/code> vira\u003c/blockquote>\n\u003cblockquote>\u003ccode>n × FATOR\u003c/code>) e tudo se repete — de modo que cada quadrilátero só pode nascer\u003c/blockquote>\n\u003cblockquote>em um espaço \u003cstrong>menor\u003c/strong> do que o do anterior.\u003c/blockquote>\n\u003cp>Como o espaço de sorteio nunca cresce, cada forma cai necessariamente dentro da\u003cbr>região da anterior. Empilhadas, as camadas produzem um túnel que gira para\u003cbr>dentro: o acaso decide a forma de cada peça, mas a regra de encolhimento decide\u003cbr>a estrutura inteira. A tela é dividida em uma grade 3 × 3 e cada célula recebe\u003cbr>uma pilha independente — mesma regra, sorteios diferentes.\u003c/p>\n\u003ch2>Como funciona\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>O quadrado de sorteio.\u003c/strong> A cada camada existe um quadrado imaginário\u003c/li>\n\u003cp>   centrado em (cx, cy) e de lado \u003ccode>n\u003c/code>. Ele nunca é desenhado; serve apenas para\u003cbr>   delimitar onde os pontos podem cair
