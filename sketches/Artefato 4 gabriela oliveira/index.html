<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Outro Patamar — futebol raiz vs. metodologia importada</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #14181c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
    }
    #sketch-holder {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #instrucoes {
      color: #aab2ba;
      font-size: 13px;
      margin-top: 10px;
      max-width: 640px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="sketch-holder">
    <div id="canvas-container"></div>
    <p id="instrucoes">
      Mova o mouse na horizontal para variar o "nível de metodologia importada".<br>
      Clique no desenho para reembaralhar a pelada.
    </p>
  </div>

  <!-- p5.js carregado via CDN — não incluído na pasta do projeto -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
